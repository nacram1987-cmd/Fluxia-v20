<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🌥️ Fluxia</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f5f5f5;
  color: #333;
}
.header {
  background: white;
  padding: 15px;
  text-align: center;
  border-bottom: 1px solid #ddd;
  position: sticky;
  top: 0;
}
.header h1 { font-size: 24px; }
.container {
  max-width: 500px;
  margin: 20px auto;
  padding: 0 15px;
}
input, select {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
  font-family: inherit;
}
button {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  font-size: 16px;
}
.btn-blue { background: #1554F0; color: white; }
.btn-green { background: #10B981; color: white; }
.btn-red { background: #EF4444; color: white; }
.btn-gray { background: #6B7280; color: white; }
.hidden { display: none; }
.gasto {
  background: white;
  padding: 12px;
  margin: 8px 0;
  border-radius: 8px;
  border-left: 4px solid #1554F0;
}
.msg {
  padding: 10px;
  margin: 10px 0;
  border-radius: 8px;
  font-weight: 600;
}
.msg-ok { background: #d4edda; color: #155724; }
</style>
</head>
<body>

<div class="header">
  <h1>🌥️ Fluxia</h1>
</div>

<div class="container">
  <!-- LOGIN -->
  <div id="login" class="hidden">
    <div class="msg msg-ok">Finanzas en la Nube</div>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="pass" placeholder="Contraseña">
    <button class="btn-blue" onclick="login()">Entrar</button>
    <button class="btn-green" onclick="signup()">Crear Cuenta</button>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">
    <div class="msg msg-ok" id="msg">✅ Conectado a Supabase</div>
    
    <h3>📝 Nuevo Gasto</h3>
    <input type="text" id="qué" placeholder="¿Qué? (Ej: Cena)">
    <input type="number" id="cuanto" placeholder="¿Cuánto?" step="0.01" min="0">
    <select id="cat">
      <option>🍽️ Comida</option>
      <option>🚗 Transporte</option>
      <option>🎬 Entretenimiento</option>
      <option>⚕️ Salud</option>
      <option>📦 Otro</option>
    </select>
    <button class="btn-blue" onclick="save()">➕ Guardar</button>
    <button class="btn-gray" onclick="sync()">🔄 Sincronizar</button>

    <h3>📊 Gastos</h3>
    <div id="list"></div>

    <button class="btn-red" onclick="logout()" style="margin-top: 20px;">👋 Salir</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL = 'https://kylduzmrfbubeamfrbbr.supabase.co';
const KEY = 'sb_publishable_5hX9-6JJ7M1JfvmeWZcz5w_U-K1TCaj';

let sb = null;
let user = null;

function init() {
  try {
    const { createClient } = window.supabase;
    sb = createClient(URL, KEY);
    console.log('✅ Supabase OK');
  } catch(e) {
    console.log('⚠️ Supabase fallo:', e);
  }
}

async function checkUser() {
  try {
    const { data: { user: u } } = await sb.auth.getUser();
    if (u) {
      user = u;
      showApp();
      load();
    } else {
      showLogin();
    }
  } catch(e) {
    console.log('Sin sesión');
    showLogin();
  }
}

async function signup() {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  
  if (!email || !pass) {
    alert('❌ Rellena email y contraseña');
    return;
  }

  try {
    const { error } = await sb.auth.signUp({ email, password: pass });
    if (error) throw error;
    alert('✅ Cuenta creada. Ahora entra');
  } catch(e) {
    alert('❌ ' + e.message);
  }
}

async function login() {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  
  if (!email || !pass) {
    alert('❌ Rellena email y contraseña');
    return;
  }

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) throw error;
    user = data.user;
    showApp();
    load();
  } catch(e) {
    alert('❌ ' + e.message);
  }
}

async function logout() {
  if (confirm('¿Salir?')) {
    await sb.auth.signOut();
    user = null;
    showLogin();
  }
}

async function save() {
  const qué = document.getElementById('qué').value.trim();
  const cuanto = parseFloat(document.getElementById('cuanto').value);
  const cat = document.getElementById('cat').value;

  if (!qué || !cuanto || cuanto <= 0) {
    alert('❌ Rellena correctamente');
    return;
  }

  // Guardar local
  let gastos = JSON.parse(localStorage.getItem('fl') || '[]');
  gastos.push({
    id: Date.now(),
    qué, cuanto, cat,
    email: user.email,
    fecha: new Date().toLocaleDateString('es-ES'),
    ts: Date.now()
  });
  localStorage.setItem('fl', JSON.stringify(gastos));

  // Guardar en nube
  try {
    await sb.from('gastos').insert([{
      usuario_id: user.id,
      email: user.email,
      concepto: qué,
      monto: cuanto,
      categoria: cat,
      fecha: new Date().toISOString()
    }]);
    msg('✅ Guardado en la nube');
  } catch(e) {
    msg('✅ Guardado localmente');
  }

  document.getElementById('qué').value = '';
  document.getElementById('cuanto').value = '';
  load();
}

async function sync() {
  msg('🔄 Sincronizando...');
  const gastos = JSON.parse(localStorage.getItem('fl') || '[]');
  let ok = 0;

  for (const g of gastos) {
    if (g.email !== user.email) continue;
    try {
      await sb.from('gastos').insert([{
        usuario_id: user.id,
        email: user.email,
        concepto: g.qué,
        monto: g.cuanto,
        categoria: g.cat,
        fecha: new Date(g.ts).toISOString()
      }]);
      ok++;
    } catch(e) {}
  }

  msg(`✅ ${ok} gastos en la nube`);
}

function load() {
  let gastos = JSON.parse(localStorage.getItem('fl') || '[]');
  gastos = gastos.filter(g => g.email === user.email);
  gastos.sort((a, b) => b.ts - a.ts);

  let html = gastos.map(g => `
    <div class="gasto">
      <strong>${g.cat} · ${g.qué}</strong><br>
      <span style="color: #EF4444; font-weight: 600;">-$${g.cuanto.toFixed(2)}</span><br>
      <span style="color: #999; font-size: 12px;">${g.fecha}</span>
    </div>
  `).join('');

  document.getElementById('list').innerHTML = html || '<p style="text-align: center; color: #999;">Sin gastos</p>';
}

function showLogin() {
  document.getElementById('login').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
}

function showApp() {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
}

function msg(txt) {
  document.getElementById('msg').textContent = txt;
}

// INIT
init();
checkUser();
</script>

</body>
</html>
