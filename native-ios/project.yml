name: FluxiaEliteNative
options:
  bundleIdPrefix: com.fluxia.elite
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  FluxiaEliteNative:
    type: application
    platform: iOS
    sources:
      - path: FluxiaEliteNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fluxia.elite.native.lab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
