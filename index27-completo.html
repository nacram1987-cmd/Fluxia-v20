<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<title>Fluxia · Beta</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F3A5C">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg, #fff);
  color: var(--text, #333);
  overflow: hidden;
}
:root {
  --primary: #0F3A5C;
  --accent: #1554F0;
  --success: #10B981;
  --warning: #F59E0B;
  --danger: #EF4444;
  --muted: #6B7280;
  --bg: #FFFFFF;
  --surface: #F9FAFB;
  --border: #E5E7EB;
  --text: #1F2937;
}
:root[data-theme="dark"] {
  --bg: #0F172A;
  --surface: #1E293B;
  --border: #334155;
  --text: #F1F5F9;
}
</style>
</head>
<body>

<!-- SUPABASE SYNC -->
<script src="supabase-sync.js"></script>

<script>
// ============================================================
// INICIALIZACIÓN FLUXIA CON SUPABASE
// ============================================================

const fluxiaSync = new FluxiaSync(
  'https://kylduzmrfbubeamfrbbr.supabase.co',
  'sb_publishable_5hX9-6JJ7M1JfvmeWZcz5w_U-K1TCaj'
);

// ============================================================
// APP LOGIC
// ============================================================

window.addEventListener('DOMContentLoaded', async () => {
  console.log('🚀 Fluxia cargando...');
  
  // Restaurar sesión
  const sesionActiva = await fluxiaSync.restoreSession();
  
  if (!sesionActiva) {
    console.log('📱 Sin sesión. Mostrando login...');
    mostrarLogin();
  } else {
    console.log('✅ Sesión activa');
    mostrarApp();
    // Sincronizar en background
    setTimeout(() => fluxiaSync.syncAhora(), 2000);
  }
});

// Escuchar cambios sincronizados
window.addEventListener('fluxia-sync-complete', (e) => {
  console.log('✅ Datos sincronizados:', e.detail);
  actualizarUI();
});

// ============================================================
// FUNCIONES UI
// ============================================================

function mostrarLogin() {
  document.body.innerHTML = `
    <div style="padding: 40px 20px; text-align: center;">
      <h1>🌥️ Fluxia</h1>
      <p style="margin: 20px 0; color: var(--muted);">Control financiero personal</p>
      
      <input type="email" id="loginEmail" placeholder="Email" 
        style="width: 100%; padding: 12px; margin: 10px 0; border: 1px solid var(--border); border-radius: 8px;">
      
      <input type="password" id="loginPassword" placeholder="Contraseña" 
        style="width: 100%; padding: 12px; margin: 10px 0; border: 1px solid var(--border); border-radius: 8px;">
      
      <button id="btnLogin" style="width: 100%; padding: 12px; margin: 20px 0; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">
        Entrar
      </button>
      
      <button id="btnSignup" style="width: 100%; padding: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; cursor: pointer;">
        Crear cuenta
      </button>
    </div>
  `;
  
  document.getElementById('btnLogin').onclick = async () => {
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    
    if (!email || !password) {
      alert('Rellena todos los campos');
      return;
    }
    
    const resultado = await fluxiaSync.login(email, password);
    if (resultado.success) {
      mostrarApp();
    } else {
      alert('❌ ' + resultado.error);
    }
  };
  
  document.getElementById('btnSignup').onclick = async () => {
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    
    if (!email || !password) {
      alert('Rellena todos los campos');
      return;
    }
    
    const resultado = await fluxiaSync.signup(email, password);
    if (resultado.success) {
      alert('✅ Cuenta creada. Ahora haz login');
      document.getElementById('btnLogin').click();
    } else {
      alert('❌ ' + resultado.error);
    }
  };
}

function mostrarApp() {
  document.body.innerHTML = `
    <div style="padding: 20px; text-align: center;">
      <h1>🌥️ Fluxia</h1>
      <p style="margin: 10px 0; color: var(--muted);">v27 - Sincronización Activa</p>
      
      <div style="margin: 30px 0; padding: 20px; background: var(--surface); border-radius: 12px;">
        <h2 style="margin: 10px 0;">📊 Estado</h2>
        <p id="statusText" style="color: var(--success); font-weight: 600;">✅ Conectado a Supabase</p>
      </div>
      
      <div style="margin: 20px 0;">
        <button onclick="anadirGasto()" style="width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; margin: 10px 0;">
          ➕ Añadir Gasto
        </button>
        
        <button onclick="verDatos()" style="width: 100%; padding: 12px; background: var(--success); color: white; border: none; border-radius: 8px; cursor: pointer; margin: 10px 0;">
          📋 Ver Datos
        </button>
        
        <button onclick="sincronizar()" style="width: 100%; padding: 12px; background: var(--warning); color: white; border: none; border-radius: 8px; cursor: pointer; margin: 10px 0;">
          🔄 Sincronizar Ahora
        </button>
        
        <button onclick="logout()" style="width: 100%; padding: 12px; background: var(--danger); color: white; border: none; border-radius: 8px; cursor: pointer; margin: 10px 0;">
          👋 Salir
        </button>
      </div>
      
      <div id="dataContainer" style="margin: 20px 0; padding: 20px; background: var(--surface); border-radius: 12px; text-align: left; max-height: 300px; overflow-y: auto; display: none;">
        <h3>📊 Tus Datos:</h3>
        <pre id="dataContent" style="font-size: 12px; white-space: pre-wrap;"></pre>
      </div>
    </div>
  `;
}

function actualizarUI() {
  const transacciones = JSON.parse(localStorage.getItem('fluxia_transacciones') || '[]');
  console.log('Transacciones actuales:', transacciones.length);
}

async function anadirGasto() {
  const concepto = prompt('¿Concepto del gasto?', 'Comida');
  if (!concepto) return;
  
  const monto = parseFloat(prompt('¿Cuánto?', '10'));
  if (!monto) return;
  
  const resultado = await fluxiaSync.guardar('transacciones', {
    fecha: new Date().toISOString().split('T')[0],
    concepto,
    monto,
    tipo: 'gasto',
    categoria: 'General',
    descripcion: ''
  });
  
  if (resultado.success) {
    alert('✅ Gasto guardado. Sincronizando...');
  }
}

function verDatos() {
  const container = document.getElementById('dataContainer');
  const content = document.getElementById('dataContent');
  
  const transacciones = JSON.parse(localStorage.getItem('fluxia_transacciones') || '[]');
  const categorias = JSON.parse(localStorage.getItem('fluxia_categorias') || '[]');
  
  content.textContent = JSON.stringify({
    transacciones,
    categorias,
    ultimaSincronizacion: localStorage.getItem('fluxia_lastSync')
  }, null, 2);
  
  container.style.display = container.style.display === 'none' ? 'block' : 'none';
}

async function sincronizar() {
  await fluxiaSync.syncAhora();
  alert('✅ Sincronización completada');
}

function logout() {
  if (confirm('¿Seguro que quieres salir?')) {
    fluxiaSync.logout();
    mostrarLogin();
  }
}
</script>

</body>
</html>
