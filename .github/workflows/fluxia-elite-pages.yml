name: Fluxia Elite - QA and verified Pages deployment
on:
  push:
    branches: [pages-v9731-real-final]
    paths:
      - '.github/workflows/fluxia-elite-pages.yml'
      - 'lab/fluxia-elite-safari-datos-reales.html'
      - 'lab/js/fluxia-elite-*.js'
      - 'lab/qa/elite-*.cjs'
      - 'lab/v97.69.html'
      - 'lab/v97.70.html'
      - 'lab/v97.70/**'
      - 'lab/v97.71.html'
      - 'lab/v97.71/**'
      - 'lab/v97.72.html'
      - 'lab/v97.72/**'
      - 'lab/v97.73.html'
      - 'lab/v97.73/**'
      - 'AUDITORIA_ELITE/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fluxia-elite-pages
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix auditorias/qa-v97.66 --no-audit --no-fund
      - run: node lab/qa/elite-modules-smoke.cjs
      - run: node lab/qa/elite-wallet-regression.cjs
      - run: node lab/qa/elite-backup-regression.cjs
      - run: node auditorias/qa-v97.66/verify-baseline.cjs
      - run: sha256sum -c AUDITORIA_ELITE/PROTECTED_SHA256.txt
      - run: npm --prefix auditorias/qa-v97.66 test
      - run: node auditorias/qa-v97.69/regression-lab.cjs
      - run: node AUDITORIA_ELITE/build-candidate.cjs
      - run: node AUDITORIA_ELITE/bank-regression.cjs AUDITORIA_ELITE/candidate/v97.70.html --extended
      - run: node AUDITORIA_ELITE/banco/build-edge.cjs
      - run: node AUDITORIA_ELITE/banco/edge-regression.cjs
      - run: node AUDITORIA_ELITE/build-lab9770.cjs
      - run: node AUDITORIA_ELITE/bank-regression.cjs lab/v97.70.html --extended
      - run: node AUDITORIA_ELITE/banco/lifecycle-regression.cjs
      - run: node AUDITORIA_ELITE/banco/notification-regression.cjs lab/v97.70.html
      - run: node AUDITORIA_ELITE/financial-regression.cjs lab/v97.70.html
      - run: node AUDITORIA_ELITE/financial-regression.cjs
      - run: node AUDITORIA_ELITE/build-candidate-v9771.cjs
      - run: node AUDITORIA_ELITE/build-lab9771.cjs
      - run: node AUDITORIA_ELITE/ledger-safety-regression.cjs AUDITORIA_ELITE/candidate/v97.71.html
      - run: node AUDITORIA_ELITE/bank-regression.cjs AUDITORIA_ELITE/candidate/v97.71.html --extended
      - run: node AUDITORIA_ELITE/banco/notification-regression.cjs lab/v97.71.html
      - run: node AUDITORIA_ELITE/financial-regression.cjs lab/v97.71.html
      - run: node AUDITORIA_ELITE/build-candidate-v9772.cjs --check
      - run: node AUDITORIA_ELITE/fijo-reconciliation-regression-v9772.cjs lab/v97.72.html
      - run: node AUDITORIA_ELITE/shared-month-v9773-regression.cjs lab/v97.73.html
      - run: node --expose-gc AUDITORIA_ELITE/benchmark.cjs
      - run: node AUDITORIA_ELITE/performance-gate.cjs
      - run: node AUDITORIA_ELITE/profile-regression.cjs
      - name: Package validated LAB and immutable stable source
        run: |
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/AUDITORIA_ELITE/code _site/AUDITORIA_ELITE/candidate
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy from effective Pages source branch using supported OIDC action
        uses: actions/deploy-pages@v4
        id: deployment
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 AUDITORIA_ELITE/smoke-pages.py --attempts 6
  archive:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package complete app, assets, protected references and audit
        env:
          FLUXIA_RELEASE_VERSION: v97.73
        run: python3 AUDITORIA_ELITE/package-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Fluxia_v97.73_LAB_COMPLETO
          path: dist/*
          retention-days: 90
      - name: Publish validated LAB ZIP only; no stable promotion
        env:
          GH_TOKEN: ${{ github.token }}
          FLUXIA_RELEASE_VERSION: v97.73
        run: |
          python3 AUDITORIA_ELITE/package-release.py
          if gh release view v97.73-LAB >/dev/null 2>&1; then
            gh release upload v97.73-LAB dist/Fluxia_v97.73_LAB_COMPLETO.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create v97.73-LAB dist/Fluxia_v97.73_LAB_COMPLETO.zip dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Fluxia v97.73 LAB: shared groups and monthly spent" --notes-file RELEASE_NOTES_v97.73_LAB.md --prerelease
          fi
