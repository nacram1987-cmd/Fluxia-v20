name: Fluxia Elite - QA and verified Pages deployment
on:
  push:
    branches: [pages-v9731-real-final]
    paths:
      - '.github/workflows/fluxia-elite-pages.yml'
      - 'lab/v97.69.html'
      - 'AUDITORIA_ELITE/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fluxia-elite-pages
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix auditorias/qa-v97.66 --no-audit --no-fund
      - run: node auditorias/qa-v97.66/verify-baseline.cjs
      - run: sha256sum -c AUDITORIA_ELITE/PROTECTED_SHA256.txt
      - run: npm --prefix auditorias/qa-v97.66 test
      - run: node auditorias/qa-v97.69/regression-lab.cjs
      - run: node AUDITORIA_ELITE/build-candidate.cjs
      - run: node AUDITORIA_ELITE/bank-regression.cjs AUDITORIA_ELITE/candidate/v97.70.html
      - run: node AUDITORIA_ELITE/financial-regression.cjs
      - run: node AUDITORIA_ELITE/profile-regression.cjs
      - name: Package only tracked source; no automatic candidate LAB publication
        run: |
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/AUDITORIA_ELITE/code _site/AUDITORIA_ELITE/candidate
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy from effective Pages source branch using supported OIDC action
        uses: actions/deploy-pages@v4
        id: deployment
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 AUDITORIA_ELITE/smoke-pages.py --attempts 6
  archive:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package complete app, assets, protected references and audit
        run: python3 AUDITORIA_ELITE/package-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Fluxia_ELITE_AUDITORIA_2026-10-13_COMPLETO
          path: dist/*
          retention-days: 90
      - name: Publish audit backup only; no candidate LAB or stable promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view elite-audit-2026-10-13 >/dev/null 2>&1; then
            gh release upload elite-audit-2026-10-13 dist/Fluxia_ELITE_AUDITORIA_2026-10-13_COMPLETO.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create elite-audit-2026-10-13 dist/Fluxia_ELITE_AUDITORIA_2026-10-13_COMPLETO.zip dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Fluxia Elite: audit and unpromoted fixes" --notes-file AUDITORIA_ELITE/README.md --prerelease
          fi
