name: Fluxia Élite · Espejo financiero (solo QA)
on:
  push:
    branches:
      - pages-v9731-real-final
    paths:
      - 'lab/fluxia-elite-safari-datos-reales.html'
      - 'lab/js/fluxia-espejo-csv-v1.js'
      - 'lab/qa/**'
      - '.github/workflows/fluxia-elite-espejo-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guardrails · HTML/JS and release metadata
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const s=fs.readFileSync('lab/fluxia-elite-safari-datos-reales.html','utf8');
          const version=s.match(/const ELITE_SAFARI_VERSION='([^']+)'/)?.[1];
          assert(version, 'version missing');
          assert(s.includes('v'+version+' · Safari'),'title mismatch');
          assert(s.includes('content="'+version+'"'),'metadata mismatch');
          assert(s.includes('js/fluxia-espejo-csv-v1.js'),'CSV module missing');
          assert(s.includes('renderCSVAudit()'),'CSV parity UI missing');
          assert(s.includes('originalVisibleVariable'),'HTML mother variable rule missing');
          assert(s.includes('renderWallet()'),'cash-wallet missing');
          assert(s.includes('renderBudgets()'),'budgets missing');
          assert(s.includes('renderLegacyAnalysis()'),'analytics missing');
          assert(s.includes('fluxia-elite-wallet-v1.js'),'wallet pure module missing');
          assert(s.includes('fluxia-elite-backup-v1.js'),'same-profile backup module missing');
          assert(s.includes('walletBackup=null'),'backup state cleanup missing');
          assert(s.includes('extraFinance={}'),'financial-extra user isolation missing');
          assert(!s.includes('gvAjustadoVal'),'wrong Disponible into Variables');
          assert(fs.existsSync('lab/versions/fluxia-elite-safari-v'+version+'.html'),'version snapshot required');
          console.log('PASS app syntax metadata and immutable snapshot v'+version);
          NODE
      - name: CSV imported data parser and month matching (offline)
        run: node lab/qa/espejo-csv-regression.cjs
      - name: Contabilidad sin duplicados (offline)
        run: node lab/qa/fluxia-elite-paridad.test.cjs
      - name: Cartera y provisiones originales (offline)
        run: node lab/qa/elite-wallet-regression.cjs
      - name: Pantallas, menú y separación de usuario (offline)
        run: node lab/qa/elite-modules-smoke.cjs
      - name: Perfil HTML privado · dinero en mano (offline)
        run: node lab/qa/elite-backup-regression.cjs
      - name: Referencias bancarias sintéticas bloqueadas (offline)
        run: node lab/qa/elite-bank-unstable-id-v2011.cjs
      - name: Huchas por fuente y regresiones recientes (offline)
        run: |
          for test in lab/qa/elite-{hucha-isolation-v20000,hucha-gross-v1958,hucha-replenishments-v1961,hucha-outstanding-v1962,hucha-noid-v1988,hucha-ledger-v1963,hucha-card-totals-v1964,hucha-name-candidates-v1960,bank-reimport-v1991,bank-conflict-review-v1989,bank-conflict-persistence-v1990,auth-session-v1981,session-resilience-v1997,server-logout-v1999,release-guard-v1998,header-actions-v1994}.cjs; do
            node "$test" || exit 1
          done
