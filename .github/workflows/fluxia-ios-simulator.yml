name: Fluxia Elite BETA native iOS simulator
on:
  push:
    branches:
      - feature/ios-ledger-core-20261014
    paths:
      - 'native-core/**'
      - '.github/workflows/fluxia-ios-simulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-simulator:
    runs-on: macos-15
    env:
      HAS_APPETIZE_TOKEN: ${{ secrets.APPETIZE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate native Xcode project
        working-directory: native-core
        run: xcodegen generate --spec project.yml
      - name: Build genuine SwiftUI iOS Simulator app
        working-directory: native-core
        run: |
          set -euo pipefail
          xcodebuild -project FluxiaEliteBeta.xcodeproj -scheme FluxiaEliteBeta -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Verify real Supabase configuration in bundled Info.plist
        working-directory: native-core
        run: |
          set -euo pipefail
          PLIST="build/Build/Products/Debug-iphonesimulator/FluxiaEliteBeta.app/Info.plist"
          test -f "$PLIST"
          URL_VALUE=$(/usr/libexec/PlistBuddy -c 'Print :FLUXIA_SUPABASE_URL' "$PLIST")
          KEY_VALUE=$(/usr/libexec/PlistBuddy -c 'Print :FLUXIA_SUPABASE_PUBLISHABLE_KEY' "$PLIST")
          test "$URL_VALUE" = "https://kylduzmrfbubeamfrbbr.supabase.co"
          case "$KEY_VALUE" in sb_publishable_*) ;; *) echo "::error::Missing public Supabase key in built iOS app"; exit 1 ;; esac
          echo "Supabase connection parameters are present in compiled iOS app."
      - name: Package simulator .app
        working-directory: native-core
        run: |
          set -euo pipefail
          test -d build/Build/Products/Debug-iphonesimulator/FluxiaEliteBeta.app
          cd build/Build/Products/Debug-iphonesimulator
          zip -qr "$GITHUB_WORKSPACE/FluxiaEliteBeta-iOS-Simulator.zip" FluxiaEliteBeta.app
      - name: Upload native simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluxiaEliteBeta-iOS-Simulator
          path: FluxiaEliteBeta-iOS-Simulator.zip
          retention-days: 14
      - name: Upload to Appetize when token is configured
        id: appetize
        if: ${{ env.HAS_APPETIZE_TOKEN == 'true' }}
        uses: appetizeio/github-action-appetize@v1.1.0
        with:
          apiToken: ${{ secrets.APPETIZE_API_TOKEN }}
          publicKey: znpbyrvr7s6xat4q7mm2jh54ga
          appFile: FluxiaEliteBeta-iOS-Simulator.zip
          platform: ios
          note: "Fluxia Élite BETA · rama nativa de pruebas"
          timeout: "1800"
      - name: Native simulator build summary
        if: always()
        run: |
          echo "## Fluxia Élite BETA native simulator" >> "$GITHUB_STEP_SUMMARY"
          echo "SwiftUI simulator .app is in the workflow artifact when build succeeds." >> "$GITHUB_STEP_SUMMARY"
          echo "Appetize upload requires APPETIZE_API_TOKEN repository secret." >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.appetize.outputs.publicKey }}" ]; then
            echo "Native interactive preview: https://appetize.io/app/${{ steps.appetize.outputs.publicKey }}" >> "$GITHUB_STEP_SUMMARY"
          fi
