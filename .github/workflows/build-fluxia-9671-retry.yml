name: Build Fluxia v96.71 retry
on:
  push:
    branches: [main]
    paths: ['tools/build_9671_retry.py']
permissions:
  contents: write
concurrency:
  group: fluxia-v9671
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/build_9671_retry.py
      - name: Commit generated v96.71
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_fluxia_v96.71_LAB.html CHECKLIST_v96.71.txt PROMPT_MAESTRO_v96.71.txt manifest_v96.71_LAB.webmanifest fluxia-sw-v96.71.js
          if ! git diff --cached --quiet; then
            git commit -m "build: Fluxia v96.71 real dashboard component"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
