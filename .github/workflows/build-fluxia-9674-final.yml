name: Build Fluxia v96.74 final
on:
  push:
    branches: [main]
    paths:
      - tools/build_9674_final.flag
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_9674.py
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add index_fluxia_v96.74_LAB.html CHECKLIST_v96.74.txt PROMPT_MAESTRO_v96.74.txt manifest_v96.74_LAB.webmanifest fluxia-sw-v96.74.js README_v96.74.md SHA256SUMS_v96.74.txt Fluxia_v96.74_LAB.zip
          git -c user.name=github-actions -c user.email=actions@github.com commit -m "build v96.74 accounting recovery" || true
          git pull --rebase origin main
          git push origin HEAD:main
