name: Fluxia Elite - Native SwiftUI iOS

on:
  workflow_dispatch:
  push:
    branches: [feature/fluxia-elite-ios-capacitor]
    paths:
      - 'native-ios/**'
      - '.github/workflows/fluxia-elite-swiftui.yml'

concurrency:
  group: fluxia-elite-swiftui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate native Xcode project
        working-directory: native-ios
        run: xcodegen generate
      - name: Compile real SwiftUI application for iOS simulator
        working-directory: native-ios
        run: |
          set -o pipefail
          xcodebuild -project FluxiaEliteNative.xcodeproj -scheme FluxiaEliteNative -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build | tee build.log
      - name: Package simulator-only build
        working-directory: native-ios
        run: |
          cd build/DerivedData/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent FluxiaEliteNative.app "$GITHUB_WORKSPACE/native-ios/Fluxia-Elite-Nativa-SwiftUI-Simulador.zip"
      - name: Upload simulator-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fluxia-Elite-Nativa-SwiftUI-Simulador
          path: native-ios/Fluxia-Elite-Nativa-SwiftUI-Simulador.zip
          if-no-files-found: error
      - name: Upload diagnostic log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Fluxia-Elite-Nativa-SwiftUI-Diagnostico
          path: native-ios/build.log
          if-no-files-found: ignore
