name: Fluxia Elite - Native SwiftUI iOS

on:
  workflow_dispatch:
  push:
    branches: [feature/fluxia-elite-ios-capacitor]
    paths:
      - 'native-ios/**'
      - '.github/workflows/fluxia-elite-swiftui.yml'

concurrency:
  group: fluxia-elite-swiftui-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Validate native financial accounting
        working-directory: native-ios
        run: |
          swiftc FluxiaEliteNative/FinanceRules.swift FluxiaEliteNative/DemoFinanceSnapshot.swift FluxiaEliteNative/ExpenseReconciliation.swift FluxiaEliteNative/BankImportSafety.swift FluxiaEliteNative/AccountIsolation.swift tests/main.swift -o /tmp/fluxia-finance-check
          /tmp/fluxia-finance-check
      - name: Generate native Xcode project
        working-directory: native-ios
        run: xcodegen generate
      - name: Compile real SwiftUI application for iOS simulator
        working-directory: native-ios
        run: |
          set -o pipefail
          xcodebuild -project FluxiaEliteNative.xcodeproj -scheme FluxiaEliteNative -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build | tee build.log
      - name: Capture native app screenshots in light and dark themes
        working-directory: native-ios
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; a=[x for v in d.values() for x in v if "iPhone" in x["name"] and x["isAvailable"]]; print(a[0]["udid"] if a else "")')"
          if [ -z "$DEVICE_ID" ]; then echo "No available iPhone simulator"; exit 1; fi
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build/DerivedData/Build/Products/Debug-iphonesimulator/FluxiaEliteNative.app
          mkdir -p screenshots
          xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.fluxia.elite.native.lab -fluxia.elite.darkMode NO
          sleep 4
          xcrun simctl io "$DEVICE_ID" screenshot screenshots/Fluxia-Elite-SwiftUI-Inicio-Claro.png
          xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.fluxia.elite.native.lab -fluxia.elite.darkMode YES
          sleep 4
          xcrun simctl io "$DEVICE_ID" screenshot screenshots/Fluxia-Elite-SwiftUI-Inicio-Oscuro.png
          test -s screenshots/Fluxia-Elite-SwiftUI-Inicio-Claro.png
          test -s screenshots/Fluxia-Elite-SwiftUI-Inicio-Oscuro.png
          if cmp -s screenshots/Fluxia-Elite-SwiftUI-Inicio-Claro.png screenshots/Fluxia-Elite-SwiftUI-Inicio-Oscuro.png; then
            echo "Light and dark screenshots are identical; theme selection did not take effect"
            exit 1
          fi
      - name: Upload real simulator screenshots for both themes
        uses: actions/upload-artifact@v4
        with:
          name: Fluxia-Elite-SwiftUI-iPhone-Claro-y-Oscuro
          path: |
            native-ios/screenshots/Fluxia-Elite-SwiftUI-Inicio-Claro.png
            native-ios/screenshots/Fluxia-Elite-SwiftUI-Inicio-Oscuro.png
          if-no-files-found: error
      - name: Package simulator-only build
        working-directory: native-ios
        run: |
          cd build/DerivedData/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent FluxiaEliteNative.app "$GITHUB_WORKSPACE/native-ios/Fluxia-Elite-Nativa-SwiftUI-Simulador.zip"
      - name: Upload simulator-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fluxia-Elite-Nativa-SwiftUI-Simulador
          path: native-ios/Fluxia-Elite-Nativa-SwiftUI-Simulador.zip
          if-no-files-found: error
      - name: Upload diagnostic log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Fluxia-Elite-Nativa-SwiftUI-Diagnostico
          path: native-ios/build.log
          if-no-files-found: ignore
