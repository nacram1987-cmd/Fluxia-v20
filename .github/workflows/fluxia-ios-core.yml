name: Fluxia Elite BETA native core tests
on:
  push:
    branches:
      - feature/ios-ledger-core-20261014
    paths:
      - 'native-core/**'
      - '.github/workflows/fluxia-ios-core.yml'
  pull_request:
    paths:
      - 'native-core/**'
      - '.github/workflows/fluxia-ios-core.yml'
jobs:
  swift-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Build and test native core
        working-directory: native-core
        run: swift test --parallel
