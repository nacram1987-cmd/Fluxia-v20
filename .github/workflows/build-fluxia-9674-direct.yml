name: Build Fluxia v96.74 direct
on:
  push:
    branches: [main]
    paths:
      - tools/build_9674_direct.flag
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_9674.py
      - name: Publish
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_fluxia_v96.74_LAB.html CHECKLIST_v96.74.txt PROMPT_MAESTRO_v96.74.txt manifest_v96.74_LAB.webmanifest fluxia-sw-v96.74.js README_v96.74.md SHA256SUMS_v96.74.txt Fluxia_v96.74_LAB.zip
          git commit -m "build: Fluxia v96.74 accounting recovery"
          git push
