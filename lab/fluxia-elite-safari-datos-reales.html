<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#f7f7f4"><title>Fluxia Élite BETA · Contraste en Safari</title>
<style>
:root{--navy:#163750;--gold:#bb9859;--muted:#667889;--bg:#f7f7f4;--line:#e6e9e8}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:var(--bg);color:var(--navy)}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.48}#app{max-width:650px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:calc(68px + env(safe-area-inset-bottom))}header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:12px 15px}.brandIcon{width:34px;height:34px;border-radius:9px;object-fit:cover}.brand{display:flex;flex-direction:column;line-height:1.03}.brand strong{font:600 25px Georgia,serif;letter-spacing:-.6px}.brand small{font-size:9px;letter-spacing:1.7px;color:var(--gold);font-weight:750}.grow{flex:1}.textbutton{background:none;border:0;color:var(--navy);font-size:13px;font-weight:650}.content{padding:18px 14px;flex:1}h1{font:600 25px Georgia,serif;margin:4px 0 14px}.intro{font-size:13px;color:var(--muted);line-height:1.5}.card{border:1px solid var(--line);background:white;border-radius:19px;padding:17px;margin-bottom:13px;box-shadow:0 2px 8px #1d314009}.hero{background:var(--navy);color:#fff;border:0}.hero small{color:#d6e2e5}.hero .big{font-size:37px;display:block;margin:7px 0;font-family:Georgia,serif}.muted{color:var(--muted);font-size:12px}.pill{background:#f1eee7;border-radius:8px;color:#936d36;padding:5px 7px;font-size:10px;font-weight:700}.titleRow{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;gap:7px}.titleRow h2{font-size:16px;margin:0}label{font-size:12px;display:block;margin-bottom:13px;color:var(--muted);font-weight:650}input,select{width:100%;margin-top:6px;border:1px solid #d6dede;border-radius:11px;padding:12px;background:white;min-height:42px;font-size:16px;color:var(--navy)}.primary{background:var(--navy);color:white;border:0;border-radius:12px;padding:14px 18px;font-weight:700;width:100%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{background:white;border:1px solid var(--line);border-radius:16px;padding:16px 13px;text-align:left;color:var(--navy);min-width:0}.tile .symbol{font-size:22px}.tile strong{display:block;margin:8px 0 4px}.tile span:last-child{font-size:12px;color:var(--muted)}.toolrow{display:flex;gap:9px;align-items:center;margin:8px 0 14px}.toolrow input,.toolrow select{margin-top:0}.toolrow select{width:42%;min-width:120px;font-size:13px}.entries{display:flex;flex-direction:column;gap:8px}.entry{background:white;border:1px solid var(--line);border-radius:14px;padding:12px 13px;width:100%;display:flex;align-items:center;gap:10px;text-align:left;color:inherit}.entryMain{min-width:0;flex:1}.entryMain strong{display:block;font-size:13px;overflow-wrap:anywhere}.entryMain small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.amount{font-size:14px;font-weight:750;white-space:nowrap}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 6px calc(7px + env(safe-area-inset-bottom));display:flex;gap:2px;justify-content:center;z-index:12}.bottom button{border:0;background:transparent;color:#7a8793;min-width:0;flex:1;max-width:95px;display:flex;flex-direction:column;align-items:center;font-size:10px;gap:3px;padding:4px 0}.bottom button.active{color:var(--navy);font-weight:800}.bottom .sym{font-size:18px}.error{background:#fff2ed;color:#a63d20;border:1px solid #f0c9bb;padding:11px;border-radius:10px;font-size:13px;margin:12px 0}.notice{font-size:11px;color:var(--muted);line-height:1.5;margin:15px 0}.back{border:0;background:transparent;color:var(--navy);padding:3px;font-size:14px;font-weight:700}.loading{text-align:center;padding:55px 10px}.spinner{border:3px solid #dce5e8;border-top-color:var(--gold);width:36px;height:36px;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}@keyframes spin{to{transform:rotate(360deg)}}#detail{position:fixed;inset:0;background:#0c203866;z-index:25;display:none;align-items:flex-end;justify-content:center}#detail.open{display:flex}.sheet{background:#fff;width:100%;max-width:650px;max-height:85dvh;overflow:auto;border-radius:22px 22px 0 0;padding:23px 18px calc(25px + env(safe-area-inset-bottom))}.sheet dl{display:grid;grid-template-columns:95px 1fr;gap:12px;font-size:13px}.sheet dt{color:var(--muted)}.sheet dd{margin:0;overflow-wrap:anywhere}.empty{text-align:center;color:var(--muted);padding:25px;font-size:13px}.hide{display:none!important}@media(min-width:680px){.bottom{max-width:650px;margin:auto}.sheet{border-radius:20px;margin-bottom:15px}#detail{align-items:center}}
</style></head><body><div id="app">
<header><img class="brandIcon" src="../fluxia-icon.png" alt="Icono original Fluxia"><div class="brand"><strong>fluxia</strong><small>ÉLITE BETA · SAFARI</small></div><div class="grow"></div><button id="logout" class="textbutton hide">Salir</button></header>
<main class="content" id="content"><div class="loading"><div class="spinner"></div>Preparando vista de contraste…</div></main>
<nav id="bottom" class="bottom hide"></nav></div>
<div id="detail"><div class="sheet"><div class="titleRow"><h2>Detalle de registro real</h2><button id="close" class="textbutton">Cerrar ✕</button></div><div id="detailContent"></div></div></div>
<script>
(() => {
'use strict';
const BASE='https://kylduzmrfbubeamfrbbr.supabase.co';
const KEY='sb_publishable_5hX9-6-J7MlJfvmeWZcz5w_U-KlTCaj';
const mods=[
{id:'inicio',title:'Inicio',icon:'⌂'},
{id:'ingresos',title:'Ingresos',icon:'↙',key:'planRescate_v2_ingresos'},
{id:'fijos',title:'Fijos',icon:'▤',key:'planRescate_v2_fijos'},
{id:'variables',title:'Variables',icon:'▱',key:'planRescate_v2_movimientos'},
{id:'huchas',title:'Huchas',icon:'◈',key:'planRescate_v2_provisiones'},
{id:'compartidos',title:'Compartidos',icon:'♧',key:'planRescate_v2_compartidos'},
{id:'financiaciones',title:'Financiaciones',icon:'◎',key:'planRescate_v2_financiaciones'}];
let token='',owner='',items={},page='inicio',search='',period='Todos',error='',loading=false;
const $=s=>document.querySelector(s),el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n};
const money=v=>typeof v==='number'&&isFinite(v)?new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(v):null;
const field=(obj,keys)=>{for(const k of keys){let v=obj[k];if(typeof v==='string'&&v.trim())return v}return null};
const canon=m=>{const a=items[m.key];return Array.isArray(a)?a:null};
function status(msg){const p=el('p','error',msg);$('#content').prepend(p)}
async function authRequest(path,accessToken,options={}){
 const res=await fetch(BASE+path,{...options,headers:{'apikey':KEY,'Authorization':'Bearer '+accessToken,'Content-Type':'application/json',...(options.headers||{})},cache:'no-store'});
 if(!res.ok)throw new Error('Supabase devolvió '+res.status+'. Comprueba la sesión y los permisos.');
 return res.json();
}
function showLoading(label){$('#content').replaceChildren(el('div','loading'));const box=$('.loading');box.append(el('div','spinner'));box.append(el('div',null,label))}
function loginScreen(){
 $('#bottom').classList.add('hide');$('#logout').classList.add('hide');$('#content').replaceChildren();
 $('#content').append(el('h1',null,'Bienvenido a Fluxia'));
 $('#content').append(el('p','intro','Accede con tu cuenta habitual. Esta vista funciona directamente en Safari y lee las colecciones reales, sin datos de demostración.'));
 const box=el('section','card');const form=el('form');
 const l1=el('label',null,'Correo electrónico'),email=el('input');email.type='email';email.autocomplete='username';email.required=true;email.placeholder='tu-correo@dominio.com';l1.append(email);
 const l2=el('label',null,'Contraseña'),pass=el('input');pass.type='password';pass.autocomplete='current-password';pass.required=true;l2.append(pass);
 const btn=el('button','primary','Acceder a mi nube');btn.type='submit';form.append(l1,l2,btn);box.append(form);$('#content').append(box);
 $('#content').append(el('p','notice','No guarda la contraseña ni tokens en el navegador. No crea, modifica ni elimina registros financieros.'));
 form.addEventListener('submit',async ev=>{
 ev.preventDefault();btn.disabled=true;error='';showLoading('Comprobando credenciales y cargando datos reales…');
 try{
 const res=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:pass.value})});
 const data=await res.json();pass.value='';
 if(!res.ok||!data.access_token||!data.user?.id)throw new Error('No se ha podido iniciar sesión. Comprueba los datos de acceso.');
 token=data.access_token;owner=data.user.id;
 const keys=mods.filter(m=>m.key).map(m=>m.key);
 const encoded=encodeURIComponent('in.('+keys.join(',')+')');
 const rows=await authRequest('/rest/v1/fluxia_datos?select=user_id,clave,v&user_id=eq.'+encodeURIComponent(owner)+'&clave='+encoded+'&limit=20',token);
 if(!Array.isArray(rows)||rows.some(r=>r.user_id!==owner||!keys.includes(r.clave)))throw new Error('Error de separación de usuario');
 items={};for(const row of rows){try{items[row.clave]=JSON.parse(row.v)}catch{items[row.clave]=null}}
 page='inicio';render();
 }catch(e){token='';owner='';items={};loginScreen();status(e.message||'Error de conexión');}
 finally{btn.disabled=false}
 });
}
function head(title){const h=el('h1',null,title);$('#content').append(h)}
function renderNav(){const b=$('#bottom');b.replaceChildren();b.classList.remove('hide');for(const m of mods.slice(0,5)){const btn=el('button',(m.id===page?'active':''));btn.append(el('span','sym',m.icon),el('span',null,m.title));btn.onclick=()=>{page=m.id;search='';period='Todos';render()};b.append(btn)}}
function renderHome(){head('Mi Fluxia');const hero=el('div','card hero');hero.append(el('span',null,'Disponible'),el('strong','big','—'),el('small',null,'Pendiente de conciliación contable · no es un saldo cero'));$('#content').append(hero);
 const group=el('div','grid');for(const m of mods.slice(1)){const arr=canon(m),btn=el('button','tile');btn.append(el('span','symbol',m.icon),el('strong',null,m.title),el('span',null,arr?arr.length+' registros originales':'Pendiente de lectura'));btn.onclick=()=>{page=m.id;search='';period='Todos';render()};group.append(btn)}$('#content').append(group);
 $('#content').append(el('p','notice','Esta es una interfaz de contraste para Safari: conserva los datos originales de Fluxia, pero no ejecuta SwiftUI. La aplicación nativa continúa en su simulador iOS.'));
}
function renderList(){
 const m=mods.find(x=>x.id===page),arr=canon(m);head(m.title);
 if(!arr){$('#content').append(el('p','error','Colección no disponible para esta cuenta; no significa saldo cero.'));return}
 const tools=el('div','toolrow'),q=el('input');q.type='search';q.placeholder='Buscar registros reales';q.value=search;q.autocomplete='off';tools.append(q);
 const periods=['Todos',...new Set(arr.map(x=>field(x,['mes','fecha','inicio'])).filter(Boolean))].sort((a,b)=>a==='Todos'?-1:b==='Todos'?1:a.localeCompare(b,'es'));
 const sel=el('select');for(const p of periods){const op=el('option',null,p);op.value=p;sel.append(op)}sel.value=period;if(sel.value!==period)period='Todos';tools.append(sel);$('#content').append(tools);
 const list=el('div','entries'),count=el('div','muted');$('#content').append(count,list);
 const draw=()=>{list.replaceChildren();const rows=arr.map((data,index)=>({data,index})).filter(({data})=>{const label=field(data,['concepto','nombre','descripcion'])||'Registro sin concepto',p=field(data,['mes','fecha','inicio'])||'';return(period==='Todos'||p===period)&&(!search||[label,p,field(data,['categoria','tipo'])||''].some(s=>s.toLocaleLowerCase('es').includes(search.toLocaleLowerCase('es'))))});count.textContent=rows.length+' de '+arr.length+' registros de origen';
 for(const {data,index} of rows.slice(0,200)){const name=field(data,['concepto','nombre','descripcion'])||'Registro sin concepto';const amount=money(data.importe??data.importeMensual??data.cuota??data.importe_total);const title=el('div','entryMain');title.append(el('strong',null,name),el('small',null,[field(data,['mes','fecha','inicio']),field(data,['categoria','tipo'])].filter(Boolean).join(' · ')||'Sin periodo registrado'));const btn=el('button','entry');btn.append(title,el('span','amount',amount??'Ver detalle ›'));btn.onclick=()=>openDetail(data);list.append(btn)}
 if(!rows.length)list.append(el('p','empty','No hay registros coincidentes.'));if(rows.length>200)list.append(el('p','muted','Vista limitada a 200 registros por rendimiento.'))};
 q.oninput=()=>{search=q.value;draw()};sel.onchange=()=>{period=sel.value;draw()};draw();
}
function openDetail(data){const d=$('#detailContent');d.replaceChildren();d.append(el('h2',null,field(data,['concepto','nombre','descripcion'])||'Registro original'));const dl=el('dl');for(const [k,title] of [['importe','Importe'],['importeMensual','Importe mensual'],['cuota','Cuota'],['importe_total','Importe total'],['mes','Mes'],['fecha','Fecha'],['categoria','Categoría'],['estado','Estado'],['origen','Origen'],['id','Identificador']]){if(data[k]===undefined||data[k]===null)continue;dl.append(el('dt',null,title),el('dd',null,typeof data[k]==='number'&&/importe|cuota/.test(k)?money(data[k]):String(data[k])))}d.append(dl,el('p','notice','Registro original de nube. No se ha modificado ni contabilizado.'));$('#detail').classList.add('open')}
function render(){if(!token){loginScreen();return}$('#logout').classList.remove('hide');renderNav();$('#content').replaceChildren();if(page==='inicio')renderHome();else renderList()}
$('#close').onclick=()=>$('#detail').classList.remove('open');$('#detail').onclick=e=>{if(e.target.id==='detail')$('#detail').classList.remove('open')};
$('#logout').onclick=()=>{token='';owner='';items={};loginScreen()};loginScreen();
})();
</script></body></html>
