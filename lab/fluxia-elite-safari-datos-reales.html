function openTutorial(force=false){if(!owner)return;let seen=false;try{seen=localStorage.getItem(tutorialKey())==='seen'}catch{}if(force||!seen){tutorialIndex=0;updateTutorial();$('#onboarding').classList.add('active')}}
function loginScreen(){
 $('#bottom').classList.add('hide');$('#logout').classList.add('hide');$('#help').classList.add('hide');$('#content').replaceChildren();
 $('#content').append(el('h1',null,'Bienvenido a Fluxia'));
 $('#content').append(el('p','intro','Accede con tu cuenta habitual. Esta vista funciona directamente en Safari y lee las colecciones reales, sin datos de demostración.'));
 const box=el('section','card');const form=el('form');
 const l1=el('label',null,'Correo electrónico'),email=el('input');email.type='email';email.autocomplete='username';email.required=true;email.placeholder='tu-correo@dominio.com';l1.append(email);
 const l2=el('label',null,'Contraseña'),pass=el('input');pass.type='password';pass.autocomplete='current-password';pass.required=true;l2.append(pass);
 const btn=el('button','primary','Acceder a mi nube');btn.type='submit';form.append(l1,l2,btn);box.append(form);$('#content').append(box);
 $('#content').append(el('p','notice','No guarda la contraseña ni tokens en el navegador. No crea, modifica ni elimina registros financieros.'));
 form.addEventListener('submit',async ev=>{
 ev.preventDefault();btn.disabled=true;error='';showLoading('Comprobando credenciales y cargando datos reales…');
 try{
 const res=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:pass.value})});
 const data=await res.json();pass.value='';
 if(!res.ok||!data.access_token||!data.user?.id)throw new Error('No se ha podido iniciar sesión. Comprueba los datos de acceso.');
 token=data.access_token;owner=data.user.id;
 const keys=mods.filter(m=>m.key).map(m=>m.key);
 const encoded=encodeURIComponent('in.('+keys.join(',')+')');
 const rows=await authRequest('/rest/v1/fluxia_datos?select=user_id,clave,v&user_id=eq.'+encodeURIComponent(owner)+'&clave='+encoded+'&limit=20',token);
 if(!Array.isArray(rows)||rows.some(r=>r.user_id!==owner||!keys.includes(r.clave)))throw new Error('Error de separación de usuario');
 items={};for(const row of rows){try{items[row.clave]=JSON.parse(row.v)}catch{items[row.clave]=null}}
 page='inicio';render();hideLoading();openTutorial();
 }catch(e){token='';owner='';items={};hideLoading();loginScreen();status(e.message||'Error de conexión');}
 finally{btn.disabled=false}
 });
}
function head(title){const h=el('h1',null,title);$('#content').append(h)}
function renderNav(){const b=$('#bottom');b.replaceChildren();b.classList.remove('hide');for(const m of mods.slice(0,5)){const btn=el('button',(m.id===page?'active':''));btn.append(el('span','sym',m.icon),el('span',null,m.title));btn.onclick=()=>{page=m.id;search='';period='Todos';render()};b.append(btn)}}
function renderHome(){
 $('#content').append(el('div','sectioneyebrow','TU ESPACIO FINANCIERO'));
 $('#content').append(el('h1','welcomeTitle','Todo bajo control.'));
 $('#content').append(el('p','welcomeDescription','Tus finanzas, claras y a tu ritmo. ✨'));
 const hero=el('div','card hero');
 const heroTop=el('div');heroTop.append(el('span','heroHeadline','◈  Disponible'),el('span','heroBadge','POR VALIDAR'));
 hero.append(heroTop,el('strong','big','—'),el('small',null,'Preparando el cálculo contable con las reglas de Fluxia. Tus registros están disponibles abajo.'));
 $('#content').append(hero);
 $('#content').append(el('h2','moduleTitle','Tus movimientos y planes'));
 const group=el('div','grid');
 const priority=['ingresos','fijos','huchas','compartidos','variables','financiaciones'];
 const moduleEmojis={ingresos:'💼',fijos:'📋',huchas:'🐷',compartidos:'👥',variables:'💳',financiaciones:'📅'};
 for(const id of priority){const m=mods.find(x=>x.id===id),arr=canon(m),btn=el('button','tile');
 btn.dataset.section=m.id;btn.append(el('span','symbol',moduleEmojis[m.id]),el('strong',null,m.title),el('span',null,arr?arr.length+' registros en tu nube':'Pendiente de lectura'));
 btn.onclick=()=>{page=m.id;search='';period='Todos';render()};group.append(btn)}$('#content').append(group);
 $('#content').append(el('p','notice','Datos originales de tu cuenta · Vista Safari de consulta rápida · La app iOS nativa sigue en desarrollo.'));
}
function renderList(){
 const m=mods.find(x=>x.id===page),arr=canon(m);head(m.title);
 if(!arr){$('#content').append(el('p','error','Colección no disponible para esta cuenta; no significa saldo cero.'));return}
 const tools=el('div','toolrow'),q=el('input');q.type='search';q.placeholder='Buscar registros reales';q.value=search;q.autocomplete='off';tools.append(q);
 const periods=['Todos',...new Set(arr.map(x=>field(x,['mes','fecha','inicio'])).filter(Boolean))].sort((a,b)=>a==='Todos'?-1:b==='Todos'?1:a.localeCompare(b,'es'));
 const sel=el('select');for(const p of periods){const op=el('option',null,p);op.value=p;sel.append(op)}sel.value=period;if(sel.value!==period)period='Todos';tools.append(sel);$('#content').append(tools);
 const list=el('div','entries'),count=el('div','muted');$('#content').append(count,list);
 const draw=()=>{list.replaceChildren();const rows=arr.map((data,index)=>({data,index})).filter(({data})=>{const label=field(data,['concepto','nombre','descripcion'])||'Registro sin concepto',p=field(data,['mes','fecha','inicio'])||'';return(period==='Todos'||p===period)&&(!search||[label,p,field(data,['categoria','tipo'])||''].some(s=>s.toLocaleLowerCase('es').includes(search.toLocaleLowerCase('es'))))});count.textContent=rows.length+' de '+arr.length+' registros de origen';
 for(const {data,index} of rows.slice(0,80)){
 const name=field(data,['concepto','nombre','descripcion'])||'Registro sin concepto';
 const amount=money(data.importe??data.importeMensual??data.cuota??data.importe_total);
 const title=el('div','entryMain');title.append(el('strong',null,name),el('small',null,chargeMeta(data)));
 const emoji=el('span','chargeEmoji',chargeIcon(data,page));emoji.setAttribute('aria-hidden','true');
 const btn=el('button','entry');btn.append(emoji,title,el('span','amount',amount??'Ver detalle ›'));
 btn.onclick=()=>openDetail(data);list.append(btn)
}
 if(!rows.length)list.append(el('p','empty','No hay registros coincidentes.'));if(rows.length>80)list.append(el('p','muted','Mostrando 80 de '+rows.length+' registros filtrados para mantener la respuesta fluida. Utiliza la búsqueda para localizar el resto.'))};
 q.oninput=()=>{search=q.value;if(searchTimer)clearTimeout(searchTimer);searchTimer=setTimeout(draw,110)};sel.onchange=()=>{period=sel.value;draw()};draw();
}
function openDetail(data){const d=$('#detailContent');d.replaceChildren();d.append(el('h2',null,chargeIcon(data,page)+'  '+(field(data,['concepto','nombre','descripcion'])||'Registro original')));const verifiedDate=actualChargeDate(data);if(verifiedDate)d.append(el('p','verifiedDate','📅 Cargo registrado: '+verifiedDate.label));else d.append(el('p','muted','Fecha exacta del cargo no disponible en este registro'));const dl=el('dl');for(const [k,title] of [['importe','Importe'],['importeMensual','Importe mensual'],['cuota','Cuota'],['importe_total','Importe total'],['mes','Mes'],['fecha','Fecha'],['categoria','Categoría'],['estado','Estado'],['origen','Origen'],['id','Identificador']]){if(data[k]===undefined||data[k]===null)continue;dl.append(el('dt',null,title),el('dd',null,typeof data[k]==='number'&&/importe|cuota/.test(k)?money(data[k]):String(data[k])))}d.append(dl,el('p','notice','Registro original de nube. No se ha modificado ni contabilizado.'));$('#detail').classList.add('open')}
function render(){if(!token){loginScreen();return}$('#logout').classList.remove('hide');$('#help').classList.remove('hide');renderNav();$('#content').replaceChildren();if(page==='inicio')renderHome();else renderList()}
$('#close').onclick=()=>$('#detail').classList.remove('open');$('#detail').onclick=e=>{if(e.target.id==='detail')$('#detail').classList.remove('open')};
$('#help').onclick=()=>openTutorial(true);
$('#helpClose').onclick=closeTutorial;$('#skipTutorial').onclick=closeTutorial;
$('#prevTutorial').onclick=()=>{if(tutorialIndex>0){tutorialIndex--;updateTutorial()}};
$('#nextTutorial').onclick=()=>{if(tutorialIndex===steps.length-1)closeTutorial();else{tutorialIndex++;updateTutorial()}};
$('#logout').onclick=()=>{token='';owner='';items={};$('#onboarding').classList.remove('active');loginScreen()};loginScreen();
})();
</script></body></html>
