/* Fluxia HTML heritage: warm ivory surfaces, navy-and-gold hierarchy and compact cards. */
:root{--navy:#142d49;--gold:#bc9859;--muted:#73818b;--bg:#f6f4ef;--line:#e8e3d9}
body{background:linear-gradient(180deg,#f8f7f3 0%,#f1f2ef 100%);-webkit-font-smoothing:antialiased}
header{box-shadow:0 2px 16px #18364c0a;border-bottom-color:#ede9df;padding:10px 15px}
.brandIcon{width:32px;height:32px}.brand strong{font-size:24px}
.content{padding:14px 13px}h1{font-family:Georgia,serif;font-size:24px}
.card{border-radius:16px;padding:15px;box-shadow:0 4px 16px #152c4010}
.hero{background:linear-gradient(135deg,#193b56,#0e263e);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:150px;height:150px;border:1px solid #ffffff26;border-radius:50%;right:-55px;top:-60px;pointer-events:none}
.tile{border-radius:15px;padding:13px 12px;box-shadow:0 1px 5px #193b5609}

.tile strong{margin:7px 0 3px;font-size:13px}.tile span:last-child{font-size:11px}
.entry{background:#fffefa;border-color:#e8e6df}.entry:active,.tile:active{background:#f4f1ea}
.bottom{box-shadow:0 -6px 22px #152e4410}.bottom button.active{color:#173b57}.bottom button.active .sym{color:#b48b49}
.primary{background:linear-gradient(120deg,#1d425f,#10273f);box-shadow:0 7px 18px #17354d23}
:focus-visible{outline:3px solid #ba9759;outline-offset:3px}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

async function remoteBrandLogo(name){
 const api='https://www.wikidata.org/w/api.php?format=json&origin=*';
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),3800);
 try{
  const res=await fetch(api+'&action=wbsearchentities&search='+encodeURIComponent(name)+'&language=es&limit=5',{signal:controller.signal});
  if(!res.ok)return null;
  const data=await res.json();
  const normal=t=>String(t||'').toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
  const hit=(data.search||[]).find(x=>normal(x.label)===normal(name)&&/^Q\d+$/.test(x.id));
  if(!hit)return null;
  const detail=await fetch(api+'&action=wbgetentities&ids='+hit.id+'&props=claims',{signal:controller.signal});
  if(!detail.ok)return null;
  const entity=(await detail.json()).entities?.[hit.id];
  const filename=entity?.claims?.P154?.find(c=>c.mainsnak?.datavalue?.type==='string')?.mainsnak?.datavalue?.value;
  if(typeof filename!=='string'||!/\.(png|svg|jpe?g)$/i.test(filename)||filename.length>160)return null;
  return {name:hit.label,src:'https://commons.wikimedia.org/wiki/Special:Redirect/file/'+encodeURIComponent(filename)+'?width=96'};
 }catch{return null}finally{clearTimeout(timer)}
}
function pumpLogoQueue(){
 while(logoTasks<maxLogoTasks&&logoQueue.length){
  const t=logoQueue.shift();logoTasks++;
  remoteBrandLogo(t.name).then(result=>{logoResults.set(t.key,result);t.resolve(result)})
   .finally(()=>{logoPending.delete(t.key);logoTasks--;pumpLogoQueue()})
 }
}
function discoverMerchantLogo(name){

 if(logoPending.has(key))return logoPending.get(key);

 logoPending.set(key,promise);return promise;
}

  if(year<2000||year>2100||month<1||month>12||day<1||day>31)continue;
  const check=new Date(Date.UTC(year,month-1,day));
  if(check.getUTCFullYear()!==year||check.getUTCMonth()!==month-1||check.getUTCDate()!==day)continue;
  return {label:String(day).padStart(2,'0')+'/'+String(month).padStart(2,'0')+'/'+year,sort:year*10000+month*100+day,source:key};
 }
 return null;
};

async function loadCanonicalProfile(prefix){
 if(!token||!owner||!/^p_usr-[a-f0-9-]{36}__$/.test(prefix))throw new Error('Perfil financiero no válido');
 const required=mods.filter(x=>x.key).map(x=>x.key);
 const allowed=new Set(required.map(k=>prefix+k));
 const optional=['v2_movimientos','v2_fijos','v2_efectivo','planRescate_v2_efectivo','v2_presupuestos','planRescate_v2_presupuestos','planRescate_v2_categorias','v2_usos','planRescate_v2_usos','planRescate_v2_notificaciones','planRescate_v2_config_plan','planRescate_v2_fondo_emergencia'];for(const key of optional)allowed.add(prefix+key);
 const query='/rest/v1/fluxia_datos?select=user_id,clave,v,updated_at&user_id=eq.'+encodeURIComponent(owner)+'&clave='+encodeURIComponent('in.('+[...allowed].join(',')+')')+'&limit=40';
 const rows=await authRequest(query,token);
 if(!Array.isArray(rows)||rows.some(x=>x.user_id!==owner||!allowed.has(x.clave)))throw new Error('Protección de perfil: datos inesperados');
 if(required.some(k=>!rows.some(r=>r.clave===prefix+k)))throw new Error('Faltan colecciones canónicas de este perfil');
 const next={};const fresh={};for(const k of required)next[k]=null;
 const nextExtra={};
 for(const row of rows){
  const key=row.clave.slice(prefix.length);
  let parsed;
  try{parsed=typeof row.v==='string'?JSON.parse(row.v):row.v}
  catch{
   if(required.includes(key))throw new Error('Datos obligatorios no interpretables en '+row.clave);
   nextExtra[key]={invalid:true,reason:'Contenido antiguo no interpretable'};fresh[key]=row.updated_at||null;continue
  }
  if(required.includes(key)){
   if(!Array.isArray(parsed))throw new Error('La colección obligatoria no es una lista: '+row.clave);
   next[key]=parsed
  }else if(optional.includes(key)){nextExtra[key]=parsed}
  fresh[key]=row.updated_at||null;
 }
 draftEdits.clear();csvAudit=null;csvAuditError='';motherAudit=null;extraFinance=nextExtra;
 items=next;sourceUpdated=fresh;activeProfile=prefix;rawSources={movimientos:Array.isArray(nextExtra.v2_movimientos)?nextExtra.v2_movimientos:[],fijos:Array.isArray(nextExtra.v2_fijos)?nextExtra.v2_fijos:[]};
 sourceDivergence=identifyUnmatchedOctober(next.planRescate_v2_movimientos||[],rawSources.movimientos);
 page='inicio';search='';period='Todos';
 render();hideLoading();openTutorial();
}

function identifyUnmatchedOctober(canonical,alternate){
 // A source differs if the SAME id has a different October date/amount, or an October id is missing.
 // This is an audit view ONLY, never a new financial posting.
 const index=new Map(canonical.map(m=>[String(m.id||''),m]));
 return alternate.filter(m=>{
  const dt=actualChargeDate(m);
  if(!dt||String(Math.floor(dt.sort/10000))+'-'+String(Math.floor(dt.sort/100)%100).padStart(2,'0')!=='2026-10')return false;
  const match=index.get(String(m.id||''));
  if(!match)return true;
  return actualChargeDate(match)?.sort!==dt.sort||recordAmount(match)!==recordAmount(m);
 }).map(record=>({record,reason:index.has(String(record.id||''))?'Registro divergente entre fuentes':'No incluido en la colección canónica'}));
}

function originalVisibleVariable(m,mes){
 if(!m||m.mes!==mes)return false;
 if(m.cuentaComoFijo||m.vinculoFijoId||m.excluido||m.excluidoDisponible)return false;
 if(['reponer_hucha','traspaso','traspaso_efectivo','puente'].includes(m.tipoInterno)||m.esTraspasoPropio===true)return false;
 if(m.origen==='efectivo'||m.tipoInterno==='gasto_efectivo')return false;
 if(m.origen==='banco'&&/\b(cajero|atm|reintegro|retirada(?: de)? efectivo|disposicion(?: de)? efectivo|cash withdrawal|withdrawal)\b/i.test(String(m.concepto||m.descripcion||m.detalle||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')))return false;
 return true;
}

function cashOrFinanceSource(keys,check){
 for(const key of keys)if(Object.prototype.hasOwnProperty.call(extraFinance,key)){
  const v=extraFinance[key];
  if(check(v))return {key,value:v,updatedAt:sourceUpdated[key]||null,present:true};
 }
 return {key:null,value:null,updatedAt:null,present:false}
}
function financeSourceNotice(source,thing){

 const dateLabel=elDate&&!Number.isNaN(elDate.getTime())?new Intl.DateTimeFormat('es-ES',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/Madrid'}).format(elDate):'sin fecha verificable';
 const stale=!elDate||Number.isNaN(elDate.getTime())||Date.now()-elDate.getTime()>24*60*60*1000;
 const note=el('div',stale?'legacySourceWarning':'legacySourceInfo');
 note.append(el('strong',null,stale?'⚠️ Copia histórica: no equivale al saldo actual':'ℹ️ Última copia leída'));
 note.append(el('p',null,source.present?'Datos de '+thing+' almacenados el '+dateLabel+'. No mezclar con movimientos en tiempo real ni considerar el saldo actual confirmado.':'No se ha encontrado una copia legible de '+thing+' para este perfil. No se representa como cero.'));
 return note
}

  content.append(el('strong',null,field(item.record,['concepto','nombre','descripcion'])||'Registro sin concepto'),el('small',null,item.date.label+' · '+item.module.title+(item.record.cuentaComoFijo||item.record.vinculoFijoId?' · Fijo vinculado':'')));
  const number=recordAmount(item.record);
  row.append(content,el('span','recentAmount',number===null?'Ver detalle':money(number)));
  row.onclick=()=>{page=item.module.id;render();openDetail(item.record,item.index,item.module.key)};
  $('#content').append(row);
 }
 renderSourceAudit();
 const footer=el('div','versionFooter');
 footer.append(el('span',null,'Fluxia Élite BETA · Safari v'+ELITE_SAFARI_VERSION));
 const history=el('button',null,'📋 Checklist y versiones');history.onclick=showVersionHistory;
 footer.append(history);$('#content').append(footer);
 $('#content').append(el('p','notice','Registros auténticos. Importes de origen ≠ totales contabilizados. Los pagos y saldos siguen pendientes de conciliación.'));
}
function renderList(){
 const m=mods.find(x=>x.id===page),arr=canon(m);
 renderMonthSelector();head(m.title);
 if(!arr){$('#content').append(el('p','error','Colección no disponible para esta cuenta; no equivale a saldo cero.'));return}
 const periodRows=monthRecords(m),fixed=periodRows.filter(x=>x.monthStatus==='match'),legacy=periodRows.filter(x=>x.monthStatus==='legacy');
 const stats=el('div','financeStrip');
 const a=el('div','stat');a.append(el('strong',null,String(periodRows.length)),el('span',null,'Registros visibles del mes'));
 const verified=el('p','periodHint',fixed.length+' con periodo confirmado · '+legacy.length+' históricos de mes sin año');
 const b=el('div','stat');b.append(el('strong',null,String(legacy.length)),el('span',null,'Solo mes, sin año'));
 stats.append(a,b);$('#content').append(stats,verified);
 const tools=el('div','toolrow'),q=el('input');q.type='search';q.placeholder='Buscar en '+monthTitle(selectedMonth);q.value=search;q.autocomplete='off';tools.append(q);
 const categories=['Todas',...new Set(periodRows.map(x=>field(x.data,['categoria','tipo'])).filter(Boolean))].sort((a,b)=>a==='Todas'?-1:b==='Todas'?1:a.localeCompare(b,'es'));
 const sel=el('select');for(const name of categories){const option=el('option',null,name);option.value=name;sel.append(option)}sel.value=categories.includes(period)?period:'Todas';tools.append(sel);$('#content').append(tools);
 $('#content').append(moduleTotalsNote(m,periodRows));
 if(page==='variables'){financialGapInfo();renderCSVAudit();renderMotherComparison();renderSourceAudit()}
 const list=el('div','entries'),count=el('div','muted');$('#content').append(count,list);
 const draw=()=>{
  list.replaceChildren();const query=search.toLocaleLowerCase('es').trim();
  const matches=periodRows.filter(({data})=>{
   const cat=field(data,['categoria','tipo'])||'';
   return (sel.value==='Todas'||cat===sel.value)&&(!query||[field(data,['concepto','nombre','descripcion'])||'',cat,field(data,['origen'])||''].some(x=>x.toLocaleLowerCase('es').includes(query)));
  });
  const exact=matches.filter(x=>x.monthStatus==='match'||x.monthStatus==='plan'),historical=matches.filter(x=>x.monthStatus==='legacy'||x.monthStatus==='undated');
  const dated=x=>actualChargeDate(x.data)?.sort||0;
  exact.sort((x,y)=>dated(y)-dated(x));
  count.textContent=matches.length+' registros mostrados · '+arr.length+' en nube en todos los periodos';
  const addGroup=(title,rows)=>{
   if(!rows.length)return;
   list.append(el('h3','recordGroup',title));
   for(const {data,index} of rows.slice(0,80)){
    const name=field(data,['concepto','nombre','descripcion'])||'Registro sin concepto',amount=recordAmount(data);
    const title=el('div','entryMain');
    title.append(el('strong',null,name),el('small',null,chargeMeta(data)));
    const btn=el('button','entry');btn.append(chargeMark(data,page),title,el('span','amount',amount===null?'Ver detalle ›':money(amount)));
    btn.onclick=()=>openDetail(data,index,m.key);list.append(btn)
   }
   if(rows.length>80)list.append(el('p','periodHint','Mostrando 80 de '+rows.length+'. Utiliza la búsqueda o categoría para localizar el resto.'));
  };
  addGroup((page==='huchas'||page==='financiaciones'?'📂 Planes vigentes · ':'📅 Registros del periodo · ')+monthTitle(selectedMonth),exact);
  addGroup(page==='huchas'||page==='financiaciones'?'⚠️ Planes sin vigencia fechada · revisar':'⚠️ Históricos: mes sin año · no contabilizados',historical);
  if(!matches.length)list.append(el('p','empty','No hay registros asociados a '+monthTitle(selectedMonth)+'. Cambia de mes o revisa los históricos.'));
 };
 q.oninput=()=>{search=q.value;if(searchTimer)clearTimeout(searchTimer);searchTimer=setTimeout(draw,110)};
 sel.onchange=()=>{period=sel.value;draw()};draw();
}
function openDetail(data,index,key){
 currentDetail={data,index,key};const d=$('#detailContent');d.replaceChildren();
 const preview=draftEdits.get(key+':'+index);const entry=preview?.record||data;
 d.append(el('h2',null,(brandFor(entry)?.name||chargeIcon(entry,page))+'  '+(field(entry,['concepto','nombre','descripcion'])||'Registro original')));
 const verifiedDate=actualChargeDate(entry);
 if(verifiedDate)d.append(el('p','verifiedDate','📅 Fecha registrada: '+verifiedDate.label));
 else d.append(el('p','muted','Fecha exacta no disponible: solo se mostrará si está guardada'));
 const dl=el('dl');
 for(const [k,title] of [['importe','Importe'],['importeMensual','Importe mensual'],['cuota','Cuota'],['importe_total','Importe total'],['mes','Mes'],['fecha','Fecha'],['fechaCargo','Fecha cargo'],['fechaPago','Fecha pago'],['categoria','Categoría'],['estado','Estado'],['origen','Origen'],['id','Identificador']]){
  if(entry[k]===undefined||entry[k]===null)continue;
  dl.append(el('dt',null,title),el('dd',null,typeof entry[k]==='number'&&/importe|cuota/.test(k)?money(entry[k]):String(entry[k])))
 }
 d.append(dl);
 if(preview)d.append(el('p','draftTag','BORRADOR DE PRUEBA · NO GUARDADO EN NUBE'));
 if(preview?.operation)d.append(el('p','editIntro','🧪 '+preview.operation.label+' · '+money(preview.operation.amount)+' · '+preview.operation.date+' · SIN EFECTO CONTABLE'));
 const actions=el('div','editActions');
 const edit=el('button','primary','✏️ Probar edición');
 edit.onclick=()=>showDraftEditor(data,index,key);
 actions.append(edit);
 if(draftEdits.has(key+':'+index)){
  const discard=el('button',null,'Descartar borrador');
  discard.onclick=()=>{draftEdits.delete(key+':'+index);openDetail(data,index,key)};
  actions.append(discard)
 }
 d.append(actions,el('p','notice','El editor de prueba no modifica Supabase, no recalcula Disponible ni cambia registros HTML. Las escrituras reales permanecen bloqueadas hasta validar las reglas contables.'));
 $('#detail').classList.add('open')
}

const moduleActions={
 'planRescate_v2_fijos':[['pagado','📌 Pago de fijo','Evitar duplicar cargos vinculados.'],['pendiente','⏳ Pendiente','Un fijo previsto no es un cargo ejecutado.']],
 'planRescate_v2_provisiones':[['aporte','💰 Aportación','No descontar dos veces aportes previstos.'],['rescate','💶 Rescate','Imputar a su fecha histórica.'],['uso','🧾 Uso de hucha','No duplicar gasto.']],
 'planRescate_v2_ingresos':[['ingreso','💼 Reconocimiento de ingreso','Requiere conciliación contable.']],
 'planRescate_v2_movimientos':[['variable','💳 Clasificación','Los fijos vinculados no pueden duplicarse.']],
 'planRescate_v2_compartidos':[['liquidar','👥 Liquidación','Validar deuda y pago.']],
 'planRescate_v2_financiaciones':[['cuota','📅 Pago de cuota','Previsto no equivale a pagado.']]
};

function showDraftEditor(data,index,key){
 const d=$('#detailContent');d.replaceChildren();
 const original=JSON.parse(JSON.stringify(data));
 const active=draftEdits.get(key+':'+index)?.record||original;
 d.append(el('span','draftTag','MODO PRUEBA · SIN GUARDAR EN LA NUBE'));
 d.append(el('h2',null,'Editar registro'));
 d.append(el('p','editIntro','Prueba los cambios con tus datos reales. La vista previa se mantiene solo durante esta sesión y desaparece al salir.'));
 const form=el('form');
 const nameKey=['concepto','nombre','descripcion'].find(k=>typeof original[k]==='string')||'concepto';
 const amountKey=['importe','importeMensual','cuota','importe_total'].find(k=>typeof original[k]==='number');
 const dateKey=['fechaCargo','fecha_cargo','fechaOperacion','fecha_operacion','fechaPago','fecha_pago','fecha'].find(k=>typeof original[k]==='string');
 const controls=[];
 function inputField(label,key,type,value,required=false){
  const wrapper=el('label',null,label),input=el('input');input.type=type;input.value=value??'';input.required=required;if(type==='number'){input.step='0.01';input.inputMode='decimal'}wrapper.append(input);form.append(wrapper);controls.push({key,input});return input
 }
 inputField('Concepto',nameKey,'text',active[nameKey]||'',true);
 if(amountKey)inputField('Importe registrado ('+amountKey+')',amountKey,'number',active[amountKey],true);
 if(dateKey){
  const raw=String(active[dateKey]||'');
  const iso=/^\d{4}-\d{2}-\d{2}/.test(raw)?raw.slice(0,10):'';
  const date=inputField('Fecha real ('+dateKey+')',dateKey,iso?'date':'text',iso||raw);
  if(date.type==='text')date.placeholder='Fecha original: mantener formato fuente'
 }
 if(typeof original.mes==='string')inputField('Periodo / mes', 'mes','text',active.mes);
 if(typeof original.categoria==='string')inputField('Categoría','categoria','text',active.categoria);
 if(typeof original.estado==='string')inputField('Estado original (no marca pagos)','estado','text',active.estado);
 const choices=moduleActions[key]||[];
 const finance=el('section','previewOperation');
 finance.append(el('h3',null,'Operaciones del módulo · simulación'));
 const actionLabel=el('label',null,'Tipo de operación'),action=el('select');
 const option=el('option',null,'Solo modificar datos del registro');option.value='';action.append(option);
 for(const [id,label] of choices){const op=el('option',null,label);op.value=id;action.append(op)}
 actionLabel.append(action);finance.append(actionLabel);
 const warning=el('p','editIntro','Estas operaciones NO cambian tu nube ni la contabilidad.');
 const aLabel=el('label',null,'Importe a simular'),aInput=el('input');aInput.type='number';aInput.step='0.01';aInput.inputMode='decimal';aLabel.append(aInput);
 const dLabel=el('label',null,'Fecha real de la operación'),dInput=el('input');dInput.type='date';dLabel.append(dInput);
 finance.append(warning,aLabel,dLabel);form.append(finance);
 action.onchange=()=>{const chosen=choices.find(c=>c[0]===action.value);warning.textContent=chosen?chosen[2]+' · No guardado en nube.':'No hay escritura financiera habilitada.';aLabel.classList.toggle('hide',!chosen);dLabel.classList.toggle('hide',!chosen)};
 action.onchange();
 const errorBox=el('div','editorError hide');
 form.append(errorBox);
 const compare=el('div','draftCompare');compare.append(el('div',null),el('div',null));
 form.append(compare);
 const actions=el('div','editActions');
 const cancel=el('button',null,'Cancelar');cancel.type='button';cancel.onclick=()=>openDetail(original,index,key);
 const save=el('button','primary','Guardar prueba');save.type='submit';
 actions.append(cancel,save);form.append(actions);
 function refreshPreview(){
  const changed=Object.assign({},original);
  for(const {key,input} of controls){changed[key]=input.type==='number'?Number(input.value):input.value.trim()}
  compare.children[0].replaceChildren(el('strong',null,'ANTES'),el('span',null,JSON.stringify(Object.fromEntries(controls.map(({key})=>[key,original[key]??null])))));
  compare.children[1].replaceChildren(el('strong',null,'DESPUÉS'),el('span',null,JSON.stringify(Object.fromEntries(controls.map(({key})=>[key,changed[key]??null])))));
  return changed
 }
 controls.forEach(({input})=>input.addEventListener('input',refreshPreview));refreshPreview();
 form.onsubmit=e=>{
  e.preventDefault();errorBox.classList.add('hide');
  const changed=refreshPreview();
  if(!changed[nameKey]||changed[nameKey].length>200){errorBox.textContent='Escribe un concepto válido de hasta 200 caracteres.';errorBox.classList.remove('hide');return}
  if(amountKey&&(!Number.isFinite(changed[amountKey])||Math.abs(changed[amountKey])>100000000)){errorBox.textContent='Importe no válido.';errorBox.classList.remove('hide');return}
  if(dateKey&&changed[dateKey]&&/fecha|date/i.test(dateKey)){
   const temp={[dateKey]:changed[dateKey]};if(!actualChargeDate(temp)&&/^\d{4}-\d{2}-\d{2}/.test(changed[dateKey])){errorBox.textContent='Fecha no válida.';errorBox.classList.remove('hide');return}
  }
  const selected=choices.find(c=>c[0]===action.value);
  let operation=null;
  if(selected){
    const num=Number(aInput.value);
    if(!aInput.value.trim()||!Number.isFinite(num)||num<=0||num>10000000){errorBox.textContent='Importe de operación no válido.';errorBox.classList.remove('hide');return}
    if(!dInput.value||!actualChargeDate({fecha:dInput.value})){errorBox.textContent='Introduce una fecha válida de operación.';errorBox.classList.remove('hide');return}
    if(key==='planRescate_v2_movimientos'&&(original.cuentaComoFijo||original.vinculoFijoId)){errorBox.textContent='Cargo vinculado a Fijos: se debe revisar en Fijos, sin duplicar un movimiento variable.';errorBox.classList.remove('hide');return}
    operation={label:selected[1],amount:num,date:dInput.value};
  }
  draftEdits.set(key+':'+index,{record:changed,operation});openDetail(original,index,key);
 };
 d.append(form)
}

function render(){if(!token){loginScreen();return}$('#logout').classList.remove('hide');$('#help').classList.remove('hide');renderNav();$('#content').replaceChildren();if(page==='inicio')renderHome();else if(mods.some(m=>m.id===page&&m.key))renderList();else renderLegacySection(page)}
$('#close').onclick=()=>$('#detail').classList.remove('open');$('#detail').onclick=e=>{if(e.target.id==='detail')$('#detail').classList.remove('open')};
$('#help').onclick=()=>openTutorial(true);
$('#helpClose').onclick=closeTutorial;$('#skipTutorial').onclick=closeTutorial;

$('#nextTutorial').onclick=()=>{if(tutorialIndex===steps.length-1)closeTutorial();else{tutorialIndex++;updateTutorial()}};
$('#logout').onclick=()=>{draftEdits.clear();csvAudit=null;csvAuditError='';motherAudit=null;token='';owner='';activeProfile='';items={};extraFinance={};sourceUpdated={};rawSources={};sourceDivergence=[];$('#onboarding').classList.remove('active');$('#detail').classList.remove('open');loginScreen()};loginScreen();
})();
</script></body></html>
