/* Fluxia HTML heritage: warm ivory surfaces, navy-and-gold hierarchy and compact cards. */

const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function monthTitle(ym){
 const match=/^(\d{4})-(0[1-9]|1[0-2])$/.exec(ym);if(!match)return 'Mes sin seleccionar';
 return MONTHS[Number(match[2])-1][0].toUpperCase()+MONTHS[Number(match[2])-1].slice(1)+' '+match[1]
}
function monthShift(ym,delta){
 const match=/^(\d{4})-(0[1-9]|1[0-2])$/.exec(ym);
 if(!match)return ym;
 const date=new Date(Date.UTC(Number(match[1]),Number(match[2])-1+delta,1));
 return date.getUTCFullYear()+'-'+String(date.getUTCMonth()+1).padStart(2,'0');
}
function recordMonth(obj){
 const d=actualChargeDate(obj);
 if(d)return {ym:String(Math.floor(d.sort/10000))+'-'+String(Math.floor(d.sort/100)%100).padStart(2,'0'),exact:true};
 const raw=field(obj,['mes','periodo']);
 if(raw){
  const v=raw.toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  const month=MONTHS.findIndex(m=>m===v||v.startsWith(m+' '));
  const yearMatch=/\b20\d{2}\b/.exec(v);
  if(month>=0){
    return yearMatch?{ym:yearMatch[0]+'-'+String(month+1).padStart(2,'0'),exact:false}:
      {month:month+1,legacy:true};
  }
  const iso=/^(20\d{2})-(0[1-9]|1[0-2])$/.exec(v);
  if(iso)return {ym:iso[1]+'-'+iso[2],exact:false}
 }
 return null
}
function monthStatus(obj,ym){
 const m=recordMonth(obj);if(!m)return 'undated';
 if(m.ym)return m.ym===ym?'match':'other';
 return m.legacy&&m.month===Number(ym.slice(5))?'legacy':'other'
}
function isFixedLinkedMovement(row){
 return !!(row&&typeof row==='object'&&(row.cuentaComoFijo===true||row.vinculoFijoId||row.pagoFijoId||row.fijoId));
}
function financialRecordRole(row){
 if(!row||typeof row!=='object')return 'unknown';
 if(row.papelera===true||row.eliminado===true||row.deleted===true||row.archivado===true||row.archived===true||row.excluido===true||row.excluidoDisponible===true)return 'excluded';
 if(isFixedLinkedMovement(row))return 'fixed-linked';
 if(row.esTraspasoPropio===true||row.origen==='efectivo'||['reponer_hucha','traspaso','traspaso_efectivo','puente','gasto_efectivo'].includes(row.tipoInterno))return row.origen==='efectivo'?'cash':'transfer';
 return 'variable-real';
}
function variableVisibleInPeriod(row,ym){
 if(!row||typeof row!=='object')return false;
 if(financialRecordRole(row)!=='variable-real')return false;
 return monthStatus(row,ym)==='match'||monthStatus(row,ym)==='legacy'
}
function monthRecords(mod){
 const arr=canon(mod);if(!arr)return [];
 const isPlan=mod.id==='huchas'||mod.id==='financiaciones';
 return arr.map((data,index)=>{
  let state=monthStatus(data,selectedMonth);
  // Plans have a validity period, unlike an individual bank charge.
  if(isPlan){
   const start=typeof data.inicio==='string'?data.inicio:null;
   const finish=typeof data.fin==='string'?data.fin:null;
   const startYm=start&&/^\d{4}-\d{2}/.test(start)?start.slice(0,7):null;
   const finishYm=finish&&/^\d{4}-\d{2}/.test(finish)?finish.slice(0,7):null;
   if((!startYm||startYm<=selectedMonth)&&(!finishYm||finishYm>=selectedMonth))state='plan';
   else if(startYm||finishYm)state='other';
   else state='undated';
  }
  return {data,index,monthStatus:state}
 }).filter(x=>((mod.id!=='variables'||variableVisibleInPeriod(x.data,selectedMonth))&&(x.monthStatus==='match'||x.monthStatus==='legacy'||(isPlan&&(x.monthStatus==='plan'||x.monthStatus==='undated')))))
}
function moveMonth(delta){selectedMonth=monthShift(selectedMonth,delta);selectedDay=Math.min(selectedDay,daysInSelectedMonth());search='';period='Todos';render()}
function daysInSelectedMonth(){const [y,m]=selectedMonth.split('-').map(Number);return new Date(Date.UTC(y,m,0)).getUTCDate()}
function fullSelectedDate(){const date=new Date(Date.UTC(Number(selectedMonth.slice(0,4)),Number(selectedMonth.slice(5))-1,selectedDay));return new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(date)}
function availableDatedMonths(){
 const counts=new Map();
 for(const mod of mods.filter(x=>x.key)){
  const rows=canon(mod);
  if(!rows)continue;
  for(const data of rows){
   const m=recordMonth(data);
   if(!m?.ym||!/^20\d{2}-(0[1-9]|1[0-2])$/.test(m.ym))continue;
   if(mod.id==='variables'&&!variableVisibleInPeriod(data,m.ym))continue;
   counts.set(m.ym,(counts.get(m.ym)||0)+1)
  }
 }
 return [...counts].sort((a,b)=>b[0].localeCompare(a[0]))
}

 const next=el('button','monthArrow','›');next.setAttribute('aria-label','Mes siguiente');next.onclick=()=>moveMonth(1);
 center.onclick=()=>{const panel=$('#monthPanel');const hidden=Boolean(panel.classList.toggle('hide'));center.setAttribute('aria-expanded',String(!hidden))};
 const refresh=el('button','monthArrow','↻');refresh.type='button';refresh.setAttribute('aria-label','Actualizar datos reales desde Supabase');refresh.title='Actualizar datos desde la nube';refresh.onclick=async()=>{if(!token||!owner||!activeProfile)return;refresh.disabled=true;showLoading('Actualizando datos reales desde Supabase…');try{await loadCanonicalProfile(activeProfile,{preserveView:true})}catch(e){hideLoading();status('No se ha podido actualizar: '+e.message)}finally{refresh.disabled=false}};
 shell.append(prev,center,next,refresh);$('#content').append(shell);
 const panel=el('div','monthPanel hide');panel.id='monthPanel';
 const monthPick=el('select'),yearPick=el('select'),dayPick=el('select');
 const fillDays=()=>{const days=new Date(Date.UTC(Number(yearPick.value||selectedMonth.slice(0,4)),Number(monthPick.value||selectedMonth.slice(5)),0)).getUTCDate();const before=dayPick.value||String(selectedDay);dayPick.replaceChildren();for(let i=1;i<=days;i++){const op=el('option',null,'Día '+i);op.value=String(i);dayPick.append(op)}dayPick.value=String(Math.min(Number(before)||1,days))};
 for(let i=0;i<12;i++){const op=el('option',null,MONTHS[i][0].toUpperCase()+MONTHS[i].slice(1));op.value=String(i+1).padStart(2,'0');monthPick.append(op)}
 const thisYear=new Date().getFullYear(),selectedYear=Number(selectedMonth.slice(0,4));
 for(let y=Math.min(2023,selectedYear);y<=Math.max(thisYear+2,selectedYear);y++){const op=el('option',null,String(y));op.value=String(y);yearPick.append(op)}
 monthPick.value=selectedMonth.slice(5);yearPick.value=selectedMonth.slice(0,4);fillDays();monthPick.onchange=fillDays;yearPick.onchange=fillDays;
 const apply=el('button','monthApply','Aplicar periodo');apply.onclick=()=>{
  selectedMonth=yearPick.value+'-'+monthPick.value;selectedDay=Number(dayPick.value);search='';period='Todos';render()
 };
 panel.append(dayPick,monthPick,yearPick,apply);
 const history=availableDatedMonths();
 if(history.length){
  panel.append(el('p','periodHint','Meses con registros fechados en Supabase · el recuento no equivale a gastos contabilizados'));
  const historyPicker=el('select');historyPicker.setAttribute('aria-label','Seleccionar mes histórico con datos');
  const placeholder=el('option',null,'Ir a un mes con datos…');placeholder.value='';historyPicker.append(placeholder);
  for(const [ym,count] of history){const option=el('option',null,monthTitle(ym)+' · '+count+' registros fechados');option.value=ym;historyPicker.append(option)}
  historyPicker.onchange=()=>{if(!historyPicker.value)return;selectedMonth=historyPicker.value;selectedDay=Math.min(selectedDay,daysInSelectedMonth());search='';period='Todos';render()};
  panel.append(historyPicker)
 }
 $('#content').append(panel);
}

}

function sourceMonthAudit(canonical,alternate,ym){
 const byId=new Map(),duplicateCanonical=[],duplicateAlternate=[],altSeen=new Set();
 for(const row of canonical){
  const id=String(row?.id||row?.movimientoId||'').trim();
  if(!id)continue;
  if(byId.has(id))duplicateCanonical.push(id);else byId.set(id,row);
 }
 const missing=[],different=[];
 for(const row of alternate){
  if(monthStatus(row,ym)!=='match')continue;
  const id=String(row?.id||row?.movimientoId||'').trim();
  if(!id){different.push({record:row,reason:'Sin identificador verificable'});continue}
  if(altSeen.has(id)){duplicateAlternate.push(id);continue}
  altSeen.add(id);
  const match=byId.get(id);
  if(!match){missing.push({record:row,reason:'Solo en v2_movimientos'})}
  else {
   const keys=motherComparisonFields(row,match).filter(k=>k!=='_fxUpdatedAt');
   if(keys.length)different.push({record:row,reason:'Campos diferentes: '+keys.join(', ')})
  }
 }
 const extra=canonical.filter(row=>monthStatus(row,ym)==='match'&&!altSeen.has(String(row?.id||row?.movimientoId||'').trim()));
 const cents=rows=>rows.reduce((n,x)=>{const amount=recordAmount(x.record);return n+(amount===null?0:Math.round(amount*100))},0);
 return {missing,different,extra,duplicateCanonical,duplicateAlternate,missingCents:cents(missing)};
}
function sourceFreshness(){

 const now=Date.now(),records=[];
 for(const key of sources){
  const stamp=sourceUpdated[key];
  const ms=Date.parse(String(stamp||''));
  const ageHours=Number.isFinite(ms)?Math.max(0,(now-ms)/3600000):null;
  records.push({key,stamp:stamp||null,ageHours,stale:ageHours===null||ageHours>48})
 }
 return records
}

function summarizeProfileBackup(backup,profile){

  // account, legacy global key or an unscoped planRescate_* value.
  const short=suffix.replace(/^planRescate_v2_/,'');
  const candidates=[stem+'v2_'+short,stem+suffix,'planRescate_v2_u_'+profile+'_'+short];
  const found=candidates.find(k=>Object.prototype.hasOwnProperty.call(backup.keys,k));
  if(!found){report.push({module:mod.id,state:'sin fuente HTML verificable',sourceCount:null,cloudCount:canon(mod)?.length??null,missing:[],extra:[],different:[],unidentified:0});continue}
  let rows=backup.keys[found];
  if(typeof rows==='string'){try{rows=JSON.parse(rows)}catch{report.push({module:mod.id,state:'fuente HTML no interpretable',sourceCount:null,cloudCount:canon(mod)?.length??null,missing:[],extra:[],different:[],unidentified:0});continue}}
  if(!Array.isArray(rows)||rows.length>100000){report.push({module:mod.id,state:'formato HTML incompatible',sourceCount:null,cloudCount:canon(mod)?.length??null,missing:[],extra:[],different:[],unidentified:0});continue}
  const cloud=canon(mod);
  if(!cloud){report.push({module:mod.id,state:'fuente Élite ausente',sourceCount:rows.length,cloudCount:null,missing:[],extra:[],different:[],unidentified:0});continue}
  const htmlIds=new Map(),cloudIds=new Map();
  let unidentified=0,duplicates=0;
  for(const row of rows){const id=motherRowId(row);if(!id){unidentified++;continue}if(htmlIds.has(id))duplicates++;else htmlIds.set(id,row)}
  for(const row of cloud){const id=motherRowId(row);if(!id){unidentified++;continue}if(cloudIds.has(id))duplicates++;else cloudIds.set(id,row)}
  const missing=[],extra=[],different=[];
  for(const [id,row] of htmlIds){const target=cloudIds.get(id);if(!target)missing.push(id);else if(motherComparisonFields(row,target).length)different.push(id)}
  for(const id of cloudIds.keys())if(!htmlIds.has(id))extra.push(id);
  // Same original banking transaction can have different local row IDs after a reimport.
  // Preserve both IDs and flag divergent pending status; never deduplicate or certify by heuristic.
  const bankMatches=[];
  if(mod.id==='variables'){
   // Legacy HTML and modern Elite may store the *same* transaction in different
   // fields (bancoRef vs bancoStableRef). Match their reference sets, never just
   // the first available field; require one-to-one candidates on both sides.
   const bankRefs=r=>{
    if(!r||r.origen!=='banco')return new Set();
    return new Set(['bancoStableRef','bancoLegacyId','bancoRef','bancoIdentity']
     .map(k=>String(r[k]??'').trim()).filter(x=>x&&!x.startsWith('fxbank9770:')));
   };
   const candidate=(a,b)=>{

     String(a.fecha||'')===String(b.fecha||'')&&
     Number.isFinite(Number(a.importe))&&Number.isFinite(Number(b.importe))&&
     Math.round(Number(a.importe)*100)===Math.round(Number(b.importe)*100);
   };
   for(const id of missing){
    const a=htmlIds.get(id);
    const matches=extra.filter(other=>candidate(a,cloudIds.get(other)));
    if(matches.length!==1)continue;
    const opposite=missing.filter(other=>candidate(htmlIds.get(other),cloudIds.get(matches[0])));
    if(opposite.length!==1)continue;
    const b=cloudIds.get(matches[0]);
    bankMatches.push({htmlId:id,eliteId:matches[0],sameBankTransaction:true,pendingDiff:a.bancoPendiente!==b.bancoPendiente});
   }
  }

  report.push({module:mod.id,state,sourceKey:found,sourceCount:rows.length,cloudCount:cloud.length,missing,extra,different,unidentified,duplicates,bankMatches})
 }

}

function compareRemoteFinancialSnapshot(saved,rows,expectedOwner,expectedProfile,requiredKeys){

 if(!Array.isArray(rows)||!Array.isArray(requiredKeys)||rows.length!==requiredKeys.length)return {ok:false,reason:'REMOTE_MODULES_MISSING'};
 const expected=new Set(requiredKeys.map(key=>expectedProfile+key)),seen=new Set();
 for(const row of rows){
  if(!row||row.user_id!==expectedOwner||!expected.has(row.clave)||seen.has(row.clave))return {ok:false,reason:'REMOTE_IDENTITY_OR_DUPLICATES'};
  seen.add(row.clave);
  const key=row.clave.slice(expectedProfile.length);
  const baseline=saved.modules?.[key];
  let value;try{value=typeof row.v==='string'?JSON.parse(row.v):row.v}catch{return {ok:false,reason:'REMOTE_DATA_INVALID',module:key}}
  if(!Array.isArray(value)||!baseline)return {ok:false,reason:'REMOTE_DATA_INVALID',module:key};

   return {ok:false,reason:'REMOTE_CLOUD_CHANGED',module:key}
  }
 }

}

function validatePrivateBackup(backup,profile){
 if(!/^usr-[a-f0-9-]{36}$/.test(profile)||backup?.v!=='fluxia-perfil-v1'||backup?.profile?.id!==profile||!backup.keys||typeof backup.keys!=='object'||Array.isArray(backup.keys))throw Error('La copia no pertenece a este perfil o no es una exportación válida del HTML');
 const key='fluxia_user_'+profile+'__v2_movimientos';
 if(!Object.prototype.hasOwnProperty.call(backup.keys,key))throw Error('La copia no contiene los movimientos canónicos del perfil');
 let rows=backup.keys[key];
 if(typeof rows==='string'){try{rows=JSON.parse(rows)}catch{throw Error('Los movimientos HTML no son JSON válido')}}
 if(!Array.isArray(rows)||rows.length>100000||rows.some(r=>!r||typeof r!=='object'||Array.isArray(r)))throw Error('Los movimientos del HTML presentan un formato incorrecto');
 const when=typeof backup.when==='string'&&Number.isFinite(Date.parse(backup.when))?backup.when:null;
 if(when&&Date.parse(when)>Date.now()+5*60*1000)throw Error('La copia tiene una fecha futura no válida');
 return {rows,when}
}
function readBackupFinancialModules(backup,profile){
 const stem='fluxia_user_'+profile+'__',modulesFound={};
 for(const mod of mods.filter(x=>x.key)){
  const short=mod.key.replace(/^planRescate_v2_/,'');
  const keys=[stem+'v2_'+short,stem+mod.key,'planRescate_v2_u_'+profile+'_'+short];
  const sourceKey=keys.find(key=>Object.prototype.hasOwnProperty.call(backup.keys,key));
  if(!sourceKey)continue;
  let value=backup.keys[sourceKey];
  if(typeof value==='string'){try{value=JSON.parse(value)}catch{continue}}
  if(!Array.isArray(value)||value.length>100000||value.some(x=>!x||typeof x!=='object'||Array.isArray(x)))continue;
  modulesFound[mod.id]={sourceKey,records:value}
 }
 return modulesFound
}
function readPrivateBackupSources(backup,profile){
 const stem='fluxia_user_'+profile+'__',result={};
 const types={v2_efectivo:v=>!!v&&typeof v==='object'&&!Array.isArray(v)&&Array.isArray(v.movimientos),
 v2_presupuestos:Array.isArray,v2_usos:Array.isArray,v2_categorias:Array.isArray};
 for(const [key,valid] of Object.entries(types)){
  const found=[stem+key,'planRescate_v2_u_'+profile+'_'+key.slice(3)].find(k=>Object.prototype.hasOwnProperty.call(backup.keys,k));
  if(!found)continue;
  let value=backup.keys[found];
  if(typeof value==='string'){try{value=JSON.parse(value)}catch{continue}}
  if(valid(value)&&JSON.stringify(value).length<5*1024*1024)result[key]={value,sourceKey:found}
 }
 return result
}
function cashOrFinanceSource(keys,check){
 if(backupFinance&&backupFinance.owner===owner&&backupFinance.profile===activeProfile){
  for(const key of keys){
   const normalized=key.startsWith('planRescate_v2_')?'v2_'+key.slice('planRescate_v2_'.length):key;
   const source=backupFinance.sources[normalized];
   if(source&&check(source.value))return {key:source.sourceKey,value:source.value,updatedAt:backupFinance.when,present:true,origin:'backup'}
  }
 }
 for(const key of keys)if(Object.prototype.hasOwnProperty.call(extraFinance,key)){
  const v=extraFinance[key];
  if(check(v))return {key,value:v,updatedAt:sourceUpdated[key]||null,present:true};
 }
 return {key:null,value:null,updatedAt:null,present:false}
}
function latestWalletMovementDate(value){
 if(!value||!Array.isArray(value.movimientos))return null;
 let latest=null;
 for(const movement of value.movimientos){
  const raw=typeof movement?.fecha==='string'?movement.fecha.trim():'';
  if(!raw)continue;
  const stamp=Date.parse(raw);
  if(Number.isFinite(stamp)&&(!latest||stamp>latest.stamp))latest={stamp,raw};
 }
 return latest
}
function financeSourceNotice(source,thing){
 const elDate=source.updatedAt?new Date(source.updatedAt):null;
 const activity=thing==='Dinero en mano'?latestWalletMovementDate(source.value):null;
 const activityDate=activity?new Date(activity.stamp):null;
 const rowStamp=elDate&&!Number.isNaN(elDate.getTime())?elDate.getTime():null;
 const effectiveStamp=Math.max(rowStamp||0,activity?.stamp||0)||null;
 const effectiveDate=effectiveStamp?new Date(effectiveStamp):null;
 const stale=!effectiveDate||Number.isNaN(effectiveDate.getTime())||Date.now()-effectiveDate.getTime()>24*60*60*1000;
 const format=date=>date&&!Number.isNaN(date.getTime())?new Intl.DateTimeFormat('es-ES',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/Madrid'}).format(date):'sin fecha verificable';
 const note=el('div',stale?'legacySourceWarning':'legacySourceInfo');
 note.append(el('strong',null,stale?'⚠️ Copia histórica: no equivale al saldo actual':'ℹ️ Última actividad leída'));
 if(source.present){
  const origin=source.origin==='backup'?'Copia privada del HTML del mismo perfil':'Supabase';
  note.append(el('p',null,origin+' · fila guardada '+format(elDate)+'. No se sincroniza ni se modifica desde esta vista.'));
  if(activity)note.append(el('p',null,'Último movimiento de efectivo: '+format(activityDate)+'. La fecha se toma del historial, además del updated_at de la fila.'));
  if(activity&&rowStamp&&activity.stamp>rowStamp+60*1000)note.append(el('p','integrityWarning','El movimiento de efectivo es más reciente que updated_at de la fila. Se muestra el historial, pero la discrepancia de marcas temporales queda señalada.'));
 }else note.append(el('p',null,'No se ha encontrado una copia legible de '+thing+' para este perfil. No se representa como cero.'));
 return note
}

function exactHuchaUsageLink(usage,huchas){
 if(!usage||typeof usage!=='object'||!Array.isArray(huchas))return {kind:'unverified'};
 const refs=['provisionId','provision_id','huchaId','hucha_id','provision_id_origen']
  .map(k=>usage[k]).filter(v=>typeof v==='string'&&v.trim()).map(v=>v.trim());
 if(!refs.length)return {kind:'unverified'};
 const ids=[...new Set(refs)];
 if(ids.length!==1)return {kind:'conflicting_references'};
 const matches=huchas.filter(h=>h&&typeof h==='object'&&String(h.id??'').trim()===ids[0]);
 if(matches.length!==1)return {kind:matches.length?'duplicate_hucha_id':'missing_hucha'};
 // Prevent a stale/incorrect ID from silently attaching a rescue to a differently named provision.
 const sourceName=String(usage.provision||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
 const targetName=String(matches[0].nombre||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
 if(sourceName&&targetName&&sourceName!==targetName)return {kind:'conflicting_hucha_name',hucha:matches[0]};
 return {kind:'linked',hucha:matches[0]}
}
function candidateHuchaByName(op,huchas){
 if(!op||!Array.isArray(huchas))return {kind:'unverified'};
 const strict=exactHuchaUsageLink(op,huchas);
 if(strict.kind!=='unverified')return strict;
 const raw=typeof op.provision==='string'?op.provision.trim():'';
 if(!raw)return {kind:'unverified'};
 const normal=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
 const target=normal(raw);
 const matches=huchas.filter(h=>h&&typeof h.nombre==='string'&&normal(h.nombre)===target);
 if(matches.length!==1)return {kind:matches.length?'ambiguous_name':'unverified'};
 return {kind:'name_candidate',hucha:matches[0]}
}
function availableRescueHuchaLink(use,huchas,uses){
 const direct=exactHuchaUsageLink(use,huchas);
 if(direct.kind==='linked')return {...direct,provisional:false};
 if(direct.kind!=='unverified')return direct;
 // A separate RLS-protected Supabase identity link is valid only if all immutable
 // operation fields and the currently active provision agree. Never mutate usages.
 const record=typeof rescueIdentityLinks!=='undefined'&&rescueIdentityLinks instanceof Map?rescueIdentityLinks.get(String(use?.id??'').trim()):null;
 if(record&&String(use?.id??'').trim()&&Array.isArray(uses)&&uses.filter(row=>String(row?.id??'').trim()===String(use?.id??'').trim()).length===1){
  const normalize=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
  const matches=huchas.filter(h=>String(h?.id??'').trim()===record.hucha_id);
  const cents=Math.round(Number(use?.importe)*100);
  if(matches.length===1&&Number.isSafeInteger(cents)&&cents===Number(record.amount_cents)&&
   String(use?.fecha??'').slice(0,10)===String(record.operation_date??'').slice(0,10)&&
   normalize(use?.provision)===normalize(record.operation_name)&&
   normalize(matches[0].nombre)===normalize(record.operation_name))
    return {kind:'linked',hucha:matches[0],provisional:false,origin:'supabase_rescue_link'};
 }
 const candidate=candidateHuchaByName(use,huchas);
 if(candidate.kind!=='name_candidate')return candidate;
 const id=String(use?.id??'').trim();
 if(!id||!Array.isArray(uses)||uses.filter(row=>String(row?.id??'').trim()===id).length!==1)return {kind:'duplicate_or_missing_use_id'};
 const outstanding=temporaryUseOutstanding(use);
 if(outstanding.kind!=='verified_summary')return {kind:'unverified_replenishment_history'};
 return {...candidate,provisional:true,pendingCents:outstanding.cents};
}
function canonicalMovementId(row,moduleId,index){
 if(!row||typeof row!=='object')return moduleId+':'+index;
 for(const key of ['id','uuid','movimientoId','movimiento_id','bankTransactionId','bank_transaction_id','transaction_id']){
  const value=row[key];if(value!==undefined&&value!==null&&String(value).trim())return 'id:'+String(value).trim()
 }
 return moduleId+':'+index
}
function unifiedHistoryRows(periodValue){
 const ids=new Map(),modules=['ingresos','fijos','variables','compartidos','financiaciones'];
 const priority={ingresos:1,compartidos:2,financiaciones:3,variables:4,fijos:5};
 for(const moduleId of modules){
  const mod=mods.find(item=>item.id===moduleId),rows=canon(mod);if(!rows)continue;
  rows.forEach((row,index)=>{
   const state=monthStatus(row,periodValue);if(state!=='match'&&state!=='legacy')return;
   const role=moduleId==='variables'?financialRecordRole(row):moduleId;
   const key=canonicalMovementId(row,moduleId,index),candidate={row,moduleId,index,state,role,key};
   const previous=ids.get(key);
   if(!previous||priority[moduleId]>priority[previous.moduleId]||(role==='fixed-linked'&&previous.role!=='fixed-linked'))ids.set(key,candidate)
  })
 }
 return [...ids.values()].sort((a,b)=>(actualChargeDate(b.row)?.sort||0)-(actualChargeDate(a.row)?.sort||0))
}

function comparePrivateModuleRows(htmlRows,cloudRows){
 if(!Array.isArray(htmlRows)||!Array.isArray(cloudRows))return null;
 const cloudById=new Map(),cloudDuplicateIds=new Set();
 for(const row of cloudRows){
  const id=motherRowId(row);
  if(!id)continue;
  if(cloudById.has(id))cloudDuplicateIds.add(id);
  else cloudById.set(id,row)
 }
 const sourceSeen=new Set();
 const results=[],counts={same:0,missing:0,different:0,unidentified:0,duplicate:0,cloudOnly:0};
 for(const row of htmlRows){
  const id=motherRowId(row);
  let kind='same',fields=[];
  if(!id){kind='unidentified'}
  else if(sourceSeen.has(id)||cloudDuplicateIds.has(id)){kind='duplicate'}
  else{
   sourceSeen.add(id);
   const cloud=cloudById.get(id);
   if(!cloud)kind='missing';
   else {fields=motherComparisonFields(row,cloud);if(fields.length)kind='different'}
  }
  counts[kind]++;results.push({row,id,kind,fields})
 }
 for(const id of cloudById.keys())if(!sourceSeen.has(id))counts.cloudOnly++;
 return {results,counts}
}
function migrationFingerprint(row){
 if(!row||typeof row!=='object')return null;
 const amount=recordAmount(row);
 const name=String(field(row,['concepto','nombre','descripcion'])||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('es').replace(/[^a-z0-9]+/g,' ').trim();
 const verified=actualChargeDate(row);
 if(!Number.isFinite(amount)||!name||!verified)return null;
 const date=String(verified.sort);
 return date.slice(0,4)+'-'+date.slice(4,6)+'-'+date.slice(6,8)+'|'+Math.round(Math.abs(amount)*100)+'|'+name
}
function migrationCollisionSignals(rows,cloud){
 const byFingerprint=new Map();
 for(const row of cloud){
  const fingerprint=migrationFingerprint(row);
  if(!fingerprint)continue;
  const entries=byFingerprint.get(fingerprint)||[];
  entries.push(motherRowId(row));byFingerprint.set(fingerprint,entries)
 }
 const collisions=[];
 for(const row of rows){
  const fingerprint=migrationFingerprint(row),id=motherRowId(row);
  if(fingerprint&&byFingerprint.has(fingerprint)&&!byFingerprint.get(fingerprint).includes(id)){
   collisions.push({id,matched_cloud_ids:byFingerprint.get(fingerprint)})
  }
 }
 return collisions
}
function migrationCandidateCollisions(rows){
 const seen=new Map(),conflicts=[];
 for(const row of rows){
  const fingerprint=migrationFingerprint(row),id=motherRowId(row);
  if(!fingerprint)continue;
  const old=seen.get(fingerprint);
  if(old&&old!==id)conflicts.push({id,possible_duplicate_id:old});
  else if(!old)seen.set(fingerprint,id)
 }
 return conflicts
}
function migrationSourceFreshness(moduleKey){
 // A private export without a trustworthy timestamp may be browsed but cannot
 // yield migration candidates. Compare timestamps for the SAME module only.
 const backupMs=Date.parse(String(backupFinance?.when||''));
 const cloudStamp=sourceUpdated[moduleKey];
 const cloudMs=Date.parse(String(cloudStamp||''));
 if(!Number.isFinite(backupMs))return {ready:false,reason:'BACKUP_DATE_UNKNOWN',backup_date:backupFinance?.when||null,cloud_updated_at:cloudStamp||null};
 if(!Number.isFinite(cloudMs))return {ready:false,reason:'CLOUD_DATE_UNKNOWN',backup_date:backupFinance.when,cloud_updated_at:cloudStamp||null};
 if(backupMs+60000<cloudMs)return {ready:false,reason:'BACKUP_OLDER_THAN_CLOUD',backup_date:backupFinance.when,cloud_updated_at:cloudStamp};
 return {ready:true,reason:'SOURCE_DATES_COMPATIBLE',backup_date:backupFinance.when,cloud_updated_at:cloudStamp}
}
function buildPrivateMigrationReport(){
 if(!token||!owner||!activeProfile||backupFinance?.owner!==owner||backupFinance?.profile!==activeProfile)throw Error('Se requiere sesión y respaldo del mismo perfil');
 const snapshot=validateCloudSnapshot(backupFinance.cloudSnapshot);
 if(!snapshot.ok)throw Error('La nube ha cambiado desde que cargaste el respaldo ('+snapshot.reason+(snapshot.module?': '+snapshot.module:'')+'). Recarga el respaldo y repite la conciliación.');
 const reports=[];
 for(const mod of mods.filter(m=>m.key)){
  const source=backupFinance.modules?.[mod.id],cloud=canon(mod);
  if(!source||!cloud){reports.push({module:mod.id,state:'BLOCKED_SOURCE_UNAVAILABLE',html_count:source?.records.length??null,cloud_count:cloud?.length??null});continue}
  const audit=comparePrivateModuleRows(source.records,cloud);
  const ids=new Set(),cloudIds=new Set(),duplicates=[];
  for(const r of cloud){const id=motherRowId(r);if(id){if(cloudIds.has(id))duplicates.push(id);cloudIds.add(id)}}
  for(const r of source.records){const id=motherRowId(r);if(id){if(ids.has(id))duplicates.push(id);ids.add(id)}}
  const noIdCloud=cloud.filter(x=>!motherRowId(x)).length;
  const freshness=migrationSourceFreshness(mod.key);
  const counts=audit.counts;
  // Never nominate tombstoned, paid-fixed, provision, transfer or ambiguous
  // entries automatically: they can represent history rather than new expenses.
  const flagged=audit.results.filter(x=>x.kind==='missing'&&unverifiedMigrationSignals(x.row).length);
  const missingRows=audit.results.filter(x=>x.kind==='missing').map(x=>x.row);
  const collisions=migrationCollisionSignals(missingRows,cloud);
  const candidateCollisions=migrationCandidateCollisions(missingRows);
  const safe=counts.different===0&&counts.duplicate===0&&counts.unidentified===0&&duplicates.length===0&&noIdCloud===0&&counts.cloudOnly===0&&flagged.length===0&&collisions.length===0&&candidateCollisions.length===0&&freshness.ready;
  reports.push({module:mod.id,state:safe?'CANDIDATES_REQUIRE_REVIEW':!freshness.ready?'BLOCKED_STALE_OR_UNDATED_BACKUP':'BLOCKED_IDENTITY_OR_CONFLICT',html_count:source.records.length,cloud_count:cloud.length,
   coincidentes:counts.same,solo_html:counts.missing,distintos:counts.different,duplicados:counts.duplicate+duplicates.length,sin_id_html:counts.unidentified,sin_id_nube:noIdCloud,solo_nube:counts.cloudOnly,
   candidate_ids:safe?audit.results.filter(x=>x.kind==='missing').map(x=>x.id):[],
   flagged_html_ids:flagged.map(x=>({id:x.id,signals:unverifiedMigrationSignals(x.row)})),
   possible_duplicate_charges:collisions,
   possible_duplicate_candidates:candidateCollisions,
   source_freshness:freshness,
   conflict_ids:audit.results.filter(x=>x.kind==='different'||x.kind==='duplicate'||x.kind==='unidentified').map(x=>x.id||null)})
 }
 return {format:'fluxia-elite-private-migration-review-v1',generated_at:new Date().toISOString(),backup_date:backupFinance.when||null,profile:activeProfile,account_id:owner,
  purpose:'PLAN PRIVADO SIN ESCRITURAS. No confirma movimientos vigentes, exclusiones, pagos ni Disponible. Debe contrastarse el HTML operativo.',modules:reports}
}
function simulateFinancialReplay(existingRows,proposedRows){
 if(!Array.isArray(existingRows)||!Array.isArray(proposedRows))return {ok:false,reason:'INVALID_INPUT'};
 const byId=new Map();
 for(const row of existingRows){
  const id=motherRowId(row);
  if(!id||byId.has(id))return {ok:false,reason:'EXISTING_IDS_INVALID'};
  byId.set(id,row)
 }
 const seen=new Set(),rows=existingRows.slice();
 let added=0;
 for(const row of proposedRows){
  const id=motherRowId(row);
  if(!id||seen.has(id))return {ok:false,reason:'PROPOSED_IDS_INVALID'};
  seen.add(id);
  if(byId.has(id)){
   if(motherComparisonFields(row,byId.get(id)).length)return {ok:false,reason:'EXISTING_ROW_CONFLICT',id};
   continue

function dryRunFinancialModule(module,sourceRecords,cloudRecords,approvedIds){
 if(!Array.isArray(sourceRecords)||!Array.isArray(cloudRecords)||!Array.isArray(approvedIds))return {ok:false,reason:'INVALID_INPUT'};
 const approved=new Set(approvedIds),cloudIds=new Set(),sourceIds=new Set();
 if(approved.size!==approvedIds.length)return {ok:false,reason:'DUPLICATE_APPROVAL_IDS'};
 for(const row of cloudRecords){
  const id=motherRowId(row);
  if(!id||cloudIds.has(id))return {ok:false,reason:'CLOUD_IDENTITY_CONFLICT'};
  cloudIds.add(id)
 }
 for(const row of sourceRecords){
  const id=motherRowId(row);
  if(!id||sourceIds.has(id))return {ok:false,reason:'HTML_IDENTITY_CONFLICT'};
  sourceIds.add(id)
 }
 const index=new Map(sourceRecords.map(row=>[motherRowId(row),row]));
 if([...approved].some(id=>!index.has(id)||cloudIds.has(id)))return {ok:false,reason:'APPROVAL_ID_NOT_NEW'};
 const additions=approvedIds.map(id=>index.get(id));
 if(additions.some(row=>unverifiedMigrationSignals(row).length))return {ok:false,reason:'CANDIDATE_REQUIRES_ACCOUNTING_REVIEW'};
 const collisions=migrationCollisionSignals(additions,cloudRecords);
 if(collisions.length)return {ok:false,reason:'CROSS_ID_DUPLICATE'};
 if(migrationCandidateCollisions(additions).length)return {ok:false,reason:'DUPLICATE_CANDIDATE_CHARGE'};
 // This is an isolated ephemeral array. The app never publishes it to Supabase.
 const combined=[...cloudRecords,...additions];
 if(combined.length!==cloudRecords.length+approved.size)return {ok:false,reason:'ROW_COUNT_MISMATCH'};
 const afterIds=new Set(combined.map(motherRowId));
 if(afterIds.size!==combined.length||[...cloudIds].some(id=>!afterIds.has(id)))return {ok:false,reason:'LOSS_OR_DUPLICATION'};
 // Execute the logical merge a second time against the simulated result.
 // Existing matching IDs must be exact copies, never rewritten or reinserted.
 const replay=simulateFinancialReplay(combined,additions);
 if(!replay.ok||replay.rows.length!==combined.length||replay.added!==0)return {ok:false,reason:'REPLAY_FAILED_OR_NOT_IDEMPOTENT'};
 if(combined.some((row,i)=>motherComparisonFields(row,replay.rows[i]).length))return {ok:false,reason:'REPLAY_CHANGED_EXISTING_ROWS'};
 return {ok:true,module,cloudCount:cloudRecords.length,added:approved.size,resultCount:combined.length,
  preservesCloud:true,idempotent:true,simulatedOnly:true}
}

function huchaBalanceAudit(rows){
 if(!Array.isArray(rows))return {complete:false,count:0,known:0,totalCents:null,unknown:0,duplicateIds:[]};
 const keys=['saldoActual','saldo_actual','saldoAcumulado','saldo_acumulado','saldoDisponible','saldo_disponible','saldo','saldo_hucha'];
 const seen=new Set(),duplicates=[],records=[];
 for(const row of rows){
  const id=String(row?.id??'').trim();
  if(id&&seen.has(id))duplicates.push(id);
  if(id)seen.add(id);
  const available=keys.filter(key=>Object.prototype.hasOwnProperty.call(row||{},key));
  const valid=available.filter(key=>typeof row[key]==='number'&&Number.isFinite(row[key])&&Math.abs(row[key])<=100000000);
  const cents=valid.length===1?Math.round(row[valid[0]]*100):null;
  records.push({id,amountCents:cents,field:valid.length===1?valid[0]:null,ambiguous:valid.length!==1||available.length>1});
 }
 const known=records.filter(x=>x.amountCents!==null&&!x.ambiguous).length;
 const complete=rows.length>0&&known===rows.length&&duplicates.length===0&&records.every(x=>x.id);
 return {complete,count:rows.length,known,unknown:rows.length-known,totalCents:complete?records.reduce((sum,x)=>sum+x.amountCents,0):null,duplicateIds:duplicates,records}
}
function grossHuchaContributions(rows){

 for(const h of rows){

  const data=huchaMonthlyContributions(h);invalid+=data.invalid;let part=0,partIssues=data.invalid;
  if(!data.sourceReady){invalid++;partIssues++}
  for(const item of data.rows){
   const op=item.record,opid=String(op.id??''),amount=op.importe,ref=id+'|'+opid;
   if(!opid||typeof amount!=='number'||!Number.isFinite(amount)||amount<0){invalid++;partIssues++;continue}
   if(seen.has(ref)){duplicates++;partIssues++;continue}
   seen.add(ref);const value=Math.round(amount*100);
   if(!Number.isSafeInteger(value)||Math.abs(value/100-amount)>1e-8){invalid++;partIssues++;continue}
   cents+=value;part+=value;count++;
   if(!actualChargeDate({fecha:op.fecha})){invalid++;partIssues++}
  }
  details.push({name:String(h.nombre||'Hucha'),cents:part,issues:partIssues})
 }
 return {cents,count,invalid,duplicates,details,complete:rows.length>0&&!invalid&&!duplicates}
}

  if(!Array.isArray(records)){
   if(typeof use.repuesto==='number'&&use.repuesto>0)result.missingHistory++;

   if(!id||typeof amount!=='number'||!Number.isFinite(amount)||amount<0||!Number.isSafeInteger(Math.round(amount*100))||Math.abs(Math.round(amount*100)/100-amount)>1e-8||!actualChargeDate({fecha:rep?.fecha})){result.unknown++;allValid=false;continue}
   if(repIds.has(id)){result.duplicates++;allValid=false;continue}
   repIds.add(id);
   const cents=Math.round(amount*100);
   localCents+=cents;result.verifiedCents+=cents;result.verified++
   const hid=String(link.hucha.id);
   if(!result.perHucha[hid])result.perHucha[hid]={cents:0,count:0};

 }

}

function temporaryUseOutstanding(use){

function huchaMonthlyContributions(hucha){
 const byMonth=hucha?.aportaciones;
 if(!byMonth||typeof byMonth!=='object'||Array.isArray(byMonth))return {rows:[],invalid:0,sourceReady:false};
 const rows=[];let invalid=0;
 for(const [month,list] of Object.entries(byMonth)){
  if(!Array.isArray(list)){invalid++;continue}
  for(const movement of list){

   rows.push({month,record:movement})

 }

}

function huchaContributionSnapshot(hucha,period){
 const found=huchaMonthlyContributions(hucha),seen=new Set();
 const result={sourceReady:found.sourceReady===true,lifetimeCents:0,asOfCents:0,monthCents:0,monthKnown:0,monthUndated:0,count:0,invalid:found.invalid,duplicates:0,monthlyHistory:[]},months=new Map();

  if(seen.has(id)){result.duplicates++;continue}

  const cents=Math.round(amount*100);
  if(!Number.isSafeInteger(cents)||Math.abs(cents/100-amount)>1e-8){result.invalid++;result.count--;continue}

  if(parsed){
   const month=String(Math.floor(parsed.sort/10000))+'-'+String(Math.floor(parsed.sort/100)%100).padStart(2,'0');
   const sourceMonth=String(item.month||'').toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
   const sourceMonthIndex=MONTHS.indexOf(sourceMonth);
   if(sourceMonthIndex>=0&&sourceMonthIndex+1!==Math.floor(parsed.sort/100)%100)result.invalid++;

 line('Retirado definitivamente',useBreakdownReady?money(snapshot.definitiveCents/100):'—');
 line('Total efectivamente repuesto',useBreakdownReady?money(snapshot.repaidCents/100):'—');
 line('Pendiente de devolver',useBreakdownReady?money(snapshot.outstandingCents/100):'—');
 line('Aportaciones de todo el histórico',snapshot.lifetimeComplete?money(snapshot.lifetimeCents/100):'—');
 line('Aportado hasta '+monthTitle(period),snapshot.monthComplete?money(snapshot.asOfCents/100):'—');
 line('Saldo al cierre de '+monthTitle(period),asOfReady?money(snapshot.asOfBalanceCents/100)+(netReady?' · reconstruido':' · provisional'):'—');
 line('Saldo histórico total',netReady?money(snapshot.availableCents/100)+' · reconstruido':provisionalReady?money(snapshot.availableCents/100)+' · provisional':'—');
 line('Saldo disponible real certificado','—');
 if(snapshot.monthlyHistory.length){
  const monthly=el('details','eliteHuchaMonthly');monthly.append(el('summary',null,'Aportaciones por mes y año · '+snapshot.monthlyHistory.length));
  for(const item of snapshot.monthlyHistory){const row=el('div','eliteHuchaBalanceLine');row.append(el('span',null,monthTitle(item.period)+' · '+item.count+' aportación'+(item.count===1?'':'es')),el('strong',null,money(item.cents/100)));monthly.append(row)}
  audit.append(monthly)
 }
 if(!snapshot.sourceReady)audit.append(el('small','integrityWarning','Historial de aportaciones ausente en esta fuente: cero no verificable.'));
 else if(!snapshot.monthComplete)audit.append(el('small','integrityWarning','Hay aportaciones sin fecha verificable o registros duplicados; no se atribuyen al mes.'));
 if(snapshot.planIssues)audit.append(el('small','integrityWarning','Provisiones mensuales contradictorias o con importe inválido; revisar el plan original.'));
 if(snapshot.issues||snapshot.conflicts)audit.append(el('small','integrityWarning',snapshot.issues+' usos incompletos · '+snapshot.conflicts+' vínculos/IDs en conflicto. No se certifica este saldo.'));
 if(snapshot.provisionalLinks)audit.append(el('small','integrityWarning',snapshot.provisionalLinks+' usos enlazados por nombre inequívoco o sin ID; requieren cotejo con el HTML operativo.'));
 if(!netReady)audit.append(el('small','integrityWarning','Saldo pendiente de conciliar con usos, rescates y reposiciones del HTML original.'));
 else audit.append(el('small','periodHint','Importes reconstruidos por identificadores verificables; pendiente de cotejo con el HTML operativo.'));
 if(snapshot.history.length){
  const history=el('details','eliteHuchaBalanceDetails');history.append(el('summary',null,'Historial de usos y reposiciones · '+snapshot.history.length));
  for(const item of snapshot.history){
   const date=item.fecha||'Fecha no verificable',label=item.tipo==='temporal'?'Retiro temporal':'Retiro definitivo';
   const row=el('div','eliteHuchaBalanceLine');row.append(el('span',null,date+' · '+label+' · '+item.origen+' · ID '+item.id+' · '+item.estado),el('strong',null,money(item.importeCents/100)));history.append(row)
   for(const rep of item.reposiciones){const entry=el('div','eliteHuchaBalanceLine');entry.append(el('span',null,(rep.fecha||'Fecha no verificable')+' · Reposición · ID '+rep.id+' · uso '+item.id),el('strong',null,'+'+money(rep.importeCents/100)));history.append(entry)}
  }
  audit.append(history)
 }
 details.append(audit);section.append(details)
 target.append(section)
}
function renderHuchaMonthlyContributions(hucha){
 const data=huchaMonthlyContributions(hucha);
 if(!data.rows.length&&!data.invalid)return null;
 const panel=el('section','eliteHistoryPanel');
 panel.append(el('h3',null,'💰 Aportaciones históricas · estructura original'));
 panel.append(el('p','periodHint',data.rows.length+' operaciones recuperadas de todos los meses guardados en esta hucha. Se conserva la fecha de cada movimiento; aún no equivalen a saldo neto.'));
 if(data.invalid)panel.append(el('p','integrityWarning',data.invalid+' entradas no interpretables; no se computan.'));
 const records=data.rows.slice().sort((a,b)=>(actualChargeDate(b.record)?.sort||0)-(actualChargeDate(a.record)?.sort||0));
 const container=el('div');let visible=30;
 const draw=()=>{
  container.replaceChildren();
  for(const item of records.slice(0,visible)){
   const line=el('div','eliteHistoryRow'),date=actualChargeDate(item.record),amount=recordAmount(item.record);
   line.append(el('strong',null,date?.label||'Fecha sin verificar · '+item.month),
    el('small',null,'Aportación · '+(item.record.id?'ID '+item.record.id:'sin ID')+' · '+(amount===null?'Importe no verificable':money(amount))));
   container.append(line)
  }
  if(visible<records.length){
   const more=el('button','monthApply','Mostrar 30 aportaciones más');
   more.type='button';more.onclick=()=>{visible+=30;draw()};
   container.append(more)
  }
 };
 draw();panel.append(container);return panel
}
function renderHistoricalOperations(entry){
 const sourceKeys=['aportaciones','rescates','usos','movimientos','historial'];
 const groups=sourceKeys.filter(key=>key!=='aportaciones'&&Array.isArray(entry?.[key])&&entry[key].length).map(key=>({key,rows:entry[key]}));
 if(!groups.length)return null;
 const panel=el('section','eliteHistoryPanel');
 panel.append(el('h3',null,'📜 Operaciones conservadas en el registro'));
 panel.append(el('p','periodHint','Consulta literal del historial original. No se suman estas operaciones ni se asignan al Disponible sin comprobar sus fechas y naturaleza.'));
 for(const group of groups){
  const fold=el('details','eliteHistoryGroup');
  fold.append(el('summary',null,group.key+' · '+group.rows.length+' operaciones'));
  let visible=40;
  const body=el('div');
  const draw=()=>{
   body.replaceChildren();
   for(const row of group.rows.slice(0,visible)){
   const item=el('div','eliteHistoryRow');
   if(row&&typeof row==='object'&&!Array.isArray(row)){
    const concept=field(row,['concepto','nombre','descripcion','tipo'])||'Operación histórica';
    const date=actualChargeDate(row);
    const amount=recordAmount(row);
    item.append(el('strong',null,concept),el('small',null,(date?.label||'Fecha no verificable')+(amount===null?'':' · '+money(amount))));
   }else item.append(el('small',null,'Operación conservada · formato no estructurado'));
   body.append(item)
   }
   if(visible<group.rows.length){
    const more=el('button','monthApply','Mostrar 40 operaciones más ('+(group.rows.length-visible)+' pendientes)');
    more.type='button';more.onclick=()=>{visible+=40;draw()};
    body.append(more)
   }
  };
  draw();fold.append(body);
  panel.append(fold)
 }
 return panel
}
function openDetail(data,index,key){
 const d=$('#detailContent');d.replaceChildren();
 const preview=draftEdits.get(key+':'+index);const entry=preview?.record||data;
 d.append(el('h2',null,(brandFor(entry)?.name||chargeIcon(entry,page))+'  '+(field(entry,['concepto','nombre','descripcion'])||'Registro original')));
 const verifiedDate=actualChargeDate(entry);
 if(verifiedDate)d.append(el('p','verifiedDate','📅 Fecha registrada: '+verifiedDate.label));
 else d.append(el('p','muted','Fecha exacta no disponible: solo se mostrará si está guardada'));
 const dl=el('dl');
 for(const [k,title] of [['importe','Importe'],['importeMensual','Importe mensual'],['cuota','Cuota'],['importe_total','Importe total'],['mes','Mes'],['fecha','Fecha'],['fechaCargo','Fecha cargo'],['fechaPago','Fecha pago'],['categoria','Categoría'],['estado','Estado'],['origen','Origen'],['id','Identificador']]){
  if(entry[k]===undefined||entry[k]===null)continue;
  dl.append(el('dt',null,title),el('dd',null,typeof entry[k]==='number'&&/importe|cuota/.test(k)?money(entry[k]):String(entry[k])))
 }
 d.append(dl);
 if(key==='planRescate_v2_provisiones'){
  const monthly=renderHuchaMonthlyContributions(entry);if(monthly)d.append(monthly);
  const history=renderHistoricalOperations(entry);if(history)d.append(history)
 }
 if(preview)d.append(el('p','draftTag','BORRADOR DE PRUEBA · NO GUARDADO EN NUBE'));
 if(preview?.operation)d.append(el('p','editIntro','🧪 '+preview.operation.label+' · '+money(preview.operation.amount)+' · '+preview.operation.date+' · SIN EFECTO CONTABLE'));
 const actions=el('div','editActions');
 const edit=el('button','primary','✏️ Probar edición');
 edit.onclick=()=>showDraftEditor(data,index,key);
 actions.append(edit);
 if(draftEdits.has(key+':'+index)){
  const discard=el('button',null,'Descartar borrador');
  discard.onclick=()=>{draftEdits.delete(key+':'+index);openDetail(data,index,key)};
  actions.append(discard)
 }
 d.append(actions,el('p','notice','El editor de prueba no modifica Supabase, no recalcula Disponible ni cambia registros HTML. Las escrituras reales permanecen bloqueadas hasta validar las reglas contables.'));
 openDetailSheet()
}

const moduleActions={
 'planRescate_v2_fijos':[['pagado','📌 Pago de fijo','Evitar duplicar cargos vinculados.'],['pendiente','⏳ Pendiente','Un fijo previsto no es un cargo ejecutado.']],
 'planRescate_v2_provisiones':[['aporte','💰 Aportación','No descontar dos veces aportes previstos.'],['rescate','💶 Rescate','Imputar a su fecha histórica.'],['uso','🧾 Uso de hucha','No duplicar gasto.']],
 'planRescate_v2_ingresos':[['ingreso','💼 Reconocimiento de ingreso','Requiere conciliación contable.']],
 'planRescate_v2_movimientos':[['variable','💳 Clasificación','Los fijos vinculados no pueden duplicarse.']],
 'planRescate_v2_compartidos':[['liquidar','👥 Liquidación','Validar deuda y pago.']],
 'planRescate_v2_financiaciones':[['cuota','📅 Pago de cuota','Previsto no equivale a pagado.']]
};

function showDraftEditor(data,index,key){
 const d=$('#detailContent');d.replaceChildren();
 const original=JSON.parse(JSON.stringify(data));
 const active=draftEdits.get(key+':'+index)?.record||original;
 d.append(el('span','draftTag','MODO PRUEBA · SIN GUARDAR EN LA NUBE'));
 d.append(el('h2',null,'Editar registro'));
 d.append(el('p','editIntro','Prueba los cambios con tus datos reales. La vista previa se mantiene solo durante esta sesión y desaparece al salir.'));
 const form=el('form');
 const nameKey=['concepto','nombre','descripcion'].find(k=>typeof original[k]==='string')||'concepto';
 const amountKey=['importe','importeMensual','cuota','importe_total'].find(k=>typeof original[k]==='number');
 const dateKey=['fechaCargo','fecha_cargo','fechaOperacion','fecha_operacion','fechaPago','fecha_pago','fecha'].find(k=>typeof original[k]==='string');
 const controls=[];
 function inputField(label,key,type,value,required=false){
  const wrapper=el('label',null,label),input=el('input');input.type=type;input.value=value??'';input.required=required;if(type==='number'){input.step='0.01';input.inputMode='decimal'}wrapper.append(input);form.append(wrapper);controls.push({key,input});return input
 }
 inputField('Concepto',nameKey,'text',active[nameKey]||'',true);
 if(amountKey)inputField('Importe registrado ('+amountKey+')',amountKey,'number',active[amountKey],true);
 if(dateKey){
  const raw=String(active[dateKey]||'');
  const iso=/^\d{4}-\d{2}-\d{2}/.test(raw)?raw.slice(0,10):'';
  const date=inputField('Fecha real ('+dateKey+')',dateKey,iso?'date':'text',iso||raw);
  if(date.type==='text')date.placeholder='Fecha original: mantener formato fuente'
 }
 if(typeof original.mes==='string')inputField('Periodo / mes', 'mes','text',active.mes);
 if(typeof original.categoria==='string')inputField('Categoría','categoria','text',active.categoria);
 if(typeof original.estado==='string')inputField('Estado original (no marca pagos)','estado','text',active.estado);
 const choices=moduleActions[key]||[];
 const finance=el('section','previewOperation');
 finance.append(el('h3',null,'Operaciones del módulo · simulación'));
 const actionLabel=el('label',null,'Tipo de operación'),action=el('select');
 const option=el('option',null,'Solo modificar datos del registro');option.value='';action.append(option);
 for(const [id,label] of choices){const op=el('option',null,label);op.value=id;action.append(op)}
 actionLabel.append(action);finance.append(actionLabel);
 const warning=el('p','editIntro','Estas operaciones NO cambian tu nube ni la contabilidad.');
 const aLabel=el('label',null,'Importe a simular'),aInput=el('input');aInput.type='number';aInput.step='0.01';aInput.inputMode='decimal';aLabel.append(aInput);
 const dLabel=el('label',null,'Fecha real de la operación'),dInput=el('input');dInput.type='date';dLabel.append(dInput);
 finance.append(warning,aLabel,dLabel);form.append(finance);
 action.onchange=()=>{const chosen=choices.find(c=>c[0]===action.value);warning.textContent=chosen?chosen[2]+' · No guardado en nube.':'No hay escritura financiera habilitada.';aLabel.classList.toggle('hide',!chosen);dLabel.classList.toggle('hide',!chosen)};
 action.onchange();
 const errorBox=el('div','editorError hide');
 form.append(errorBox);
 const compare=el('div','draftCompare');compare.append(el('div',null),el('div',null));
 form.append(compare);
 const actions=el('div','editActions');
 const cancel=el('button',null,'Cancelar');cancel.type='button';cancel.onclick=()=>openDetail(original,index,key);
 const save=el('button','primary','Guardar prueba');save.type='submit';
 actions.append(cancel,save);form.append(actions);
 function refreshPreview(){
  const changed=Object.assign({},original);
  for(const {key,input} of controls){changed[key]=input.type==='number'?Number(input.value):input.value.trim()}
  compare.children[0].replaceChildren(el('strong',null,'ANTES'),el('span',null,JSON.stringify(Object.fromEntries(controls.map(({key})=>[key,original[key]??null])))));
  compare.children[1].replaceChildren(el('strong',null,'DESPUÉS'),el('span',null,JSON.stringify(Object.fromEntries(controls.map(({key})=>[key,changed[key]??null])))));
  return changed
 }
 controls.forEach(({input})=>input.addEventListener('input',refreshPreview));refreshPreview();
 form.onsubmit=e=>{
  e.preventDefault();errorBox.classList.add('hide');
  const changed=refreshPreview();
  if(!changed[nameKey]||changed[nameKey].length>200){errorBox.textContent='Escribe un concepto válido de hasta 200 caracteres.';errorBox.classList.remove('hide');return}
  if(amountKey&&(!Number.isFinite(changed[amountKey])||Math.abs(changed[amountKey])>100000000)){errorBox.textContent='Importe no válido.';errorBox.classList.remove('hide');return}
  if(dateKey&&changed[dateKey]&&/fecha|date/i.test(dateKey)){
   const temp={[dateKey]:changed[dateKey]};if(!actualChargeDate(temp)&&/^\d{4}-\d{2}-\d{2}/.test(changed[dateKey])){errorBox.textContent='Fecha no válida.';errorBox.classList.remove('hide');return}
  }
  const selected=choices.find(c=>c[0]===action.value);
  let operation=null;
  if(selected){
    const num=Number(aInput.value);
    if(!aInput.value.trim()||!Number.isFinite(num)||num<=0||num>10000000){errorBox.textContent='Importe de operación no válido.';errorBox.classList.remove('hide');return}
    if(!dInput.value||!actualChargeDate({fecha:dInput.value})){errorBox.textContent='Introduce una fecha válida de operación.';errorBox.classList.remove('hide');return}
    if(key==='planRescate_v2_movimientos'&&(original.cuentaComoFijo||original.vinculoFijoId)){errorBox.textContent='Cargo vinculado a Fijos: se debe revisar en Fijos, sin duplicar un movimiento variable.';errorBox.classList.remove('hide');return}
    operation={label:selected[1],amount:num,date:dInput.value};
  }
  draftEdits.set(key+':'+index,{record:changed,operation});openDetail(original,index,key);
 };
 d.append(form)
}

function render(){
 if(!token){loginScreen();return}
 try{
  $('#help').classList.remove('hide');
  renderNav();$('#content').replaceChildren();
  if(page==='inicio')renderHome();
  else if(mods.some(m=>m.id===page&&m.key))renderList();
  else renderLegacySection(page)
 }catch(error){
  // Never leave the authenticated user in a blank screen after a view exception.
  const content=$('#content');content.replaceChildren();
  content.append(el('h1',null,'Fluxia Élite · recuperación de pantalla'));
  content.append(el('p','integrityWarning','La sesión permanece iniciada, pero no ha podido mostrarse esta pantalla. Tus datos no se han modificado.'));
  content.append(el('p','periodHint','Error de interfaz: '+String(error?.message||'desconocido').slice(0,220)));
  const home=el('button','legacyPrimary','⌂ Volver a Inicio');
  home.onclick=()=>{page='inicio';search='';period='Todos';render()};
  const retry=el('button','monthApply','↻ Reintentar esta pantalla');
  retry.onclick=()=>render();
  const refresh=el('button','monthApply','☁️ Recargar los datos de Supabase');
  refresh.onclick=async()=>{refresh.disabled=true;showLoading('Comprobando tu nube…');try{await loadCanonicalProfile(activeProfile,{preserveView:true})}catch(e){hideLoading();status('No se pudo actualizar: '+e.message)}finally{refresh.disabled=false}};
  content.append(home,retry,refresh);
  if(typeof console!=='undefined')console.error('Fluxia Élite render recovery',error)
 }
}

})();
