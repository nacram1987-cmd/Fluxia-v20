<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#102b45">
<title>Fluxia Élite BETA · Simulador iOS ajustado</title>
<style>
:root{--usable-height:70svh;--gap:104px;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#eef0ef;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,system-ui}
#layout{position:fixed;inset:0;display:flex;flex-direction:column;width:100%;height:var(--usable-height);background:#eef0ef;overflow:hidden}
#top{flex:0 0 34px;height:34px;display:flex;align-items:center;justify-content:space-between;padding:3px 12px;background:#122e49;color:white;font-size:12px}
#top strong{font-family:Georgia,serif;font-size:16px}#top span{color:#d3af77;font-weight:600}
#top button{font:inherit;border:1px solid #8a9cab;color:#fff;background:transparent;border-radius:7px;padding:3px 8px}
#sim{width:100%;height:100%;flex:1 1 0;min-height:0;border:0;background:#eef0ef;display:block}
#info{font-size:11px;line-height:14px;padding:3px 10px;text-align:center;background:#fff5dc;color:#5f4c2c;flex:0 0 auto}
@media(display-mode:standalone){:root{--gap:18px}#top{height:28px;flex-basis:28px}#info{display:none}}
</style>
</head>
<body>
<div id="layout">
  <div id="top"><div><strong>fluxia</strong> <span>ÉLITE BETA · iOS</span></div><button id="retry" type="button">Reiniciar vista</button></div>
  <iframe id="sim" title="Aplicación SwiftUI Fluxia Élite BETA en simulador nativo remoto"
    allow="autoplay; clipboard-read; clipboard-write; fullscreen"
    referrerpolicy="strict-origin-when-cross-origin"
    src="https://appetize.io/embed/znpbyrvr7s6xat4q7mm2jh54ga?screenOnly=true&amp;scale=auto&amp;autoplay=true&amp;centered=both&amp;showRotateButtons=false&amp;device=iphone16promax"></iframe>
  <div id="info">Pantalla nativa real · Ajustada para dejar libre la barra inferior de Safari</div>
</div>
<script>
(function(){
  const root=document.documentElement, sim=document.getElementById('sim');
  function fit(){
    // Safari toolbars can cover the last ~90px of a 100dvh iframe.
    // visualViewport reports the actually visible area on iPhone.
    const viewport=window.visualViewport;
    const available=viewport ? viewport.height : window.innerHeight;
    const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
    const reserved=standalone?12:85;
    root.style.setProperty('--usable-height', Math.max(340,Math.floor(available-reserved))+'px');
  }
  fit();window.addEventListener('resize',fit);window.addEventListener('orientationchange',fit);
  if(window.visualViewport){window.visualViewport.addEventListener('resize',fit);window.visualViewport.addEventListener('scroll',fit)}
  document.getElementById('retry').addEventListener('click',function(){
    // Reload embed only, never HTML stable or cloud data.
    const base=sim.src.split('&reload=')[0];
    sim.src=base+'&reload='+Date.now();
  });
})();
</script>
</body></html>
